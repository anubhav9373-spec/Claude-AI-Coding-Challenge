<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--bg2:#0d1220;--bg3:#111827;
  --card:#131c2e;--card2:#1a2540;
  --border:#1e2d47;--border2:#253554;
  --accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;
  --green:#10b981;--green2:#34d399;
  --red:#ef4444;--red2:#f87171;
  --yellow:#f59e0b;--yellow2:#fbbf24;
  --purple:#8b5cf6;--purple2:#a78bfa;
  --cyan:#06b6d4;--cyan2:#22d3ee;
  --orange:#f97316;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse2{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.3)}50%{box-shadow:0 0 40px rgba(59,130,246,.6)}}
@keyframes bgGrid{0%,100%{opacity:.04}50%{opacity:.08}}
@keyframes barAnim{from{width:0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dashOffset{to{stroke-dashoffset:var(--target-offset)}}

.fade-in{animation:fadeIn .45s ease both}
.glow-btn{animation:pulse2 2s ease-in-out infinite}

/* LAYOUT */
#app{min-height:100vh;position:relative}
#app::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(59,130,246,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(139,92,246,.04) 0%,transparent 60%);pointer-events:none;z-index:0}
.screen{display:none;min-height:100vh;padding:90px 20px 60px;position:relative;z-index:1}
.screen.active{display:block}
.container{max-width:960px;margin:0 auto}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,12,20,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
#topbar-logo{font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:.5px;font-family:monospace}
#topbar-steps{display:flex;gap:6px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s}
.step-dot.done{background:var(--green)}
.step-dot.active{background:var(--accent)}
#topbar-label{font-size:11px;color:var(--text3);font-family:monospace}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--border2);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card-sm{padding:16px;border-radius:12px}
.card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit;text-align:center;justify-content:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 8px 24px rgba(59,130,246,.4)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--border);transform:translateY(-1px)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669;transform:translateY(-1px);box-shadow:0 8px 24px rgba(16,185,129,.4)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px)}
.btn-lg{padding:16px 36px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;box-shadow:none !important}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-red{background:rgba(239,68,68,.15);color:var(--red2);border:1px solid rgba(239,68,68,.3)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow2);border:1px solid rgba(245,158,11,.3)}
.badge-green{background:rgba(16,185,129,.15);color:var(--green2);border:1px solid rgba(16,185,129,.3)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent2);border:1px solid rgba(59,130,246,.3)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple2);border:1px solid rgba(139,92,246,.3)}
.badge-orange{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}

/* PROGRESS */
.progress-wrap{background:rgba(255,255,255,.07);border-radius:20px;height:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:20px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.progress-wrap.lg{height:12px}

/* GRIDS */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* CHOICE CARDS */
.choice-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;position:relative}
.choice-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.choice-card.selected{border-color:var(--accent);background:rgba(59,130,246,.08)}
.choice-card.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.choice-checkmark{position:absolute;top:12px;right:12px;width:24px;height:24px;background:var(--accent);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.choice-card.selected .choice-checkmark{display:flex}

/* SECTION HEADER */
.section-header{text-align:center;margin-bottom:36px}
.section-eyebrow{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-family:monospace}
.section-title{font-size:30px;font-weight:800;line-height:1.2;margin-bottom:10px}
.section-sub{font-size:15px;color:var(--text2);max-width:560px;margin:0 auto;line-height:1.7}

/* WHY BOX */
.why-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:12px 16px;margin-top:10px;font-size:13px;color:var(--accent3);line-height:1.6}
.why-box strong{color:var(--accent2)}

/* NOTIF */
.notif{border-left:3px solid;padding:12px 16px;border-radius:0 10px 10px 0;background:var(--card2);margin:10px 0;font-size:13px;line-height:1.5}
.notif-info{border-color:var(--accent)}
.notif-warn{border-color:var(--yellow)}
.notif-danger{border-color:var(--red)}
.notif-success{border-color:var(--green)}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0}

/* TAG */
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--border2);color:var(--text2);margin:3px}

/* METRIC CARD */
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.metric-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.metric-value{font-size:26px;font-weight:800;font-family:monospace;line-height:1}
.metric-sub{font-size:11px;color:var(--text3)}

/* NEG TRACK */
.neg-track{display:flex;gap:8px;margin-bottom:24px}
.neg-step{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .4s}
.neg-step.done{background:var(--green)}
.neg-step.active{background:var(--accent)}

/* OUTCOME BANNER */
.outcome-banner{border-radius:16px;padding:28px;text-align:center;margin-bottom:28px}
.outcome-great{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(6,182,212,.08));border:1px solid rgba(16,185,129,.3)}
.outcome-good{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.08));border:1px solid rgba(59,130,246,.3)}
.outcome-mid{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(249,115,22,.06));border:1px solid rgba(245,158,11,.3)}
.outcome-bad{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(245,158,11,.06));border:1px solid rgba(239,68,68,.3)}
.outcome-fail{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(139,92,246,.08));border:1px solid rgba(239,68,68,.4)}

/* SCORE RING */
.score-ring-wrap{display:inline-flex;align-items:center;justify-content:center;position:relative}
.score-ring-wrap svg{transform:rotate(-90deg)}
.score-ring-label{position:absolute;text-align:center;pointer-events:none}

/* WELCOME */
.welcome-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.welcome-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(30,45,71,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(30,45,71,.35) 1px,transparent 1px);background-size:60px 60px;z-index:0;animation:bgGrid 4s ease-in-out infinite}

/* FEATURE PILLS */
.feature-pill{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:6px;margin:4px}

/* TRADEOFF BOX */
.tradeoff-box{background:rgba(245,158,11,.08);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--yellow2);margin:8px 0}

/* SCORE GRID for final */
.score-mini-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}

@media(max-width:600px){.section-title{font-size:22px}.btn-lg{padding:14px 24px;font-size:14px}}
</style>
</head>
<body>
<div id="topbar" style="display:none">
  <div id="topbar-logo">⚡ OPERATION LIFELINE</div>
  <div id="topbar-steps"></div>
  <div id="topbar-label"></div>
</div>
<div id="app">
  <div id="screen-welcome" class="screen active"></div>
  <div id="screen-company" class="screen"></div>
  <div id="screen-crisis" class="screen"></div>
  <div id="screen-warroom" class="screen"></div>
  <div id="screen-negotiation" class="screen"></div>
  <div id="screen-ceo" class="screen"></div>
  <div id="screen-ai" class="screen"></div>
  <div id="screen-dashboard" class="screen"></div>
</div>

<script>
// ─── UTILITIES ────────────────────────────────────────────────────────────────
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function pickN(a,n){const s=[...a];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s.slice(0,n)}
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function clamp(v,lo=0,hi=100){return Math.max(lo,Math.min(hi,v))}
function el(id){return document.getElementById(id)}
function qs(sel,ctx=document){return ctx.querySelector(sel)}
function div(cls='',html=''){const d=document.createElement('div');if(cls)d.className=cls;if(html)d.innerHTML=html;return d}

function progressBar(value,color='#3b82f6',large=false){
  return `<div class="progress-wrap${large?' lg':''}"><div class="progress-bar" style="width:0%;background:${color}" data-target="${value}"></div></div>`;
}
function animateBars(container=document){
  container.querySelectorAll('.progress-bar[data-target]').forEach(b=>{
    const t=b.getAttribute('data-target');
    setTimeout(()=>{b.style.width=t+'%'},80);
  });
}
function metricColor(v){return v>=65?'#10b981':v>=45?'#3b82f6':v>=30?'#f59e0b':'#ef4444'}
function scoreRing(score,size=120){
  const r=44,circ=2*Math.PI*r;
  const offset=circ-(score/100)*circ;
  const color=score>=75?'#10b981':score>=50?'#3b82f6':score>=30?'#f59e0b':'#ef4444';
  return `<div class="score-ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="8"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}"
        style="transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)"
        data-ring-offset="${offset.toFixed(1)}"/>
    </svg>
    <div class="score-ring-label">
      <div style="font-size:${size*0.2}px;font-weight:800;color:${color};font-family:monospace;line-height:1">${score}</div>
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">score</div>
    </div>
  </div>`;
}
function animateRings(container=document){
  container.querySelectorAll('[data-ring-offset]').forEach(c=>{
    const off=c.getAttribute('data-ring-offset');
    setTimeout(()=>{c.style.strokeDashoffset=off},200);
  });
}

// ─── DATA ─────────────────────────────────────────────────────────────────────
const INDUSTRIES=[
  {name:'Pharmaceutical Mfg',emoji:'💊',color:'#10b981'},
  {name:'Automotive Parts',emoji:'🚗',color:'#3b82f6'},
  {name:'Consumer Electronics',emoji:'📱',color:'#8b5cf6'},
  {name:'Food & Beverage',emoji:'🍃',color:'#f59e0b'},
  {name:'Aerospace Components',emoji:'✈️',color:'#06b6d4'},
  {name:'Semiconductor Chips',emoji:'🔬',color:'#ef4444'},
  {name:'Industrial Machinery',emoji:'⚙️',color:'#f97316'},
  {name:'Medical Devices',emoji:'🏥',color:'#ec4899'},
];
const CO_NAMES=['Velorix','Nexara','Stratovance','Omnivast','Keldrix','Quanta Dynamics','Primeshift','TerraCore','Solarius','Meridian Works'];
const FAC_NAMES=['NovaTech','PrimeCo','AlphaWorks','ZenithMfg','ApexProd','VortexMfg','PeakOps','EliteFab','TitanForge','CoreMake'];
const WH_NAMES=['CentralHub','EastDepot','WestLogix','NorthVault','SouthBase','OmegaStore','GlobalCache','SwiftStore','PrimePlex','DeltaStore'];
const SUP_NAMES=['SupplyBridge','NexusCorp','PrimeSrc','GlobalVend','TrustSource','ReliableCo','ApexSupply','CoreLink','VendMax','ProSource'];
const COUNTRIES=['Germany','Japan','Vietnam','India','Mexico','Poland','Thailand','Brazil','South Korea','Turkey','Malaysia','Taiwan','Canada','Indonesia'];

const CRISES=[
  {type:'Factory Fire',emoji:'🔥',urgency:'CRITICAL',color:'#ef4444',dim:'rgba(239,68,68,.12)',
   headline:(c)=>`Major fire destroys ${c.factories[0]}'s primary production line`,
   impact:'Production capacity down 60%. Insurance claim will take 3–6 months. Delivery commitments at serious risk.',
   why:'A factory fire removes production capacity instantly. It takes months to restore — and customers feel the pain within days.',
   effects:{cost:-25,inventory:-30,profit:-28,delivery:-35,satisfaction:-30}},
  {type:'Supplier Bankruptcy',emoji:'📉',urgency:'CRITICAL',color:'#f97316',dim:'rgba(249,115,22,.12)',
   headline:(c)=>`Key supplier ${c.suppliers[0]} files Chapter 11 bankruptcy overnight`,
   impact:'50% of raw material supply cut off without warning. Alternative sourcing will cost 30–40% premium.',
   why:'Supplier bankruptcy is a blindside event. You have no leverage — they\'re gone. Finding alternatives fast is expensive and risky.',
   effects:{cost:-20,inventory:-35,profit:-22,delivery:-28,satisfaction:-25}},
  {type:'Port Strike',emoji:'⚓',urgency:'HIGH',color:'#f59e0b',dim:'rgba(245,158,11,.12)',
   headline:(c)=>`Longshoremen strike shuts down ${c.countries[0]} port operations indefinitely`,
   impact:'40,000 containers stranded. Import/export halted for 3–8 weeks. Spot freight rates surge 200%.',
   why:'Port strikes affect every company shipping through that port simultaneously — you\'re competing with thousands for the same alternatives.',
   effects:{cost:-18,inventory:-22,profit:-18,delivery:-40,satisfaction:-22}},
  {type:'Cyberattack',emoji:'💻',urgency:'CRITICAL',color:'#8b5cf6',dim:'rgba(139,92,246,.12)',
   headline:(c)=>`Ransomware encrypts ${c.name}'s ERP and warehouse management systems`,
   impact:'All digital operations down. Inventory tracking manual. Ransom demand: $4.2M. Recovery: 2–3 weeks.',
   why:'Modern supply chains run on software. When your ERP goes down, you lose visibility into inventory, orders, and suppliers at once.',
   effects:{cost:-22,inventory:-15,profit:-25,delivery:-30,satisfaction:-28}},
  {type:'Regional Flood',emoji:'🌊',urgency:'HIGH',color:'#06b6d4',dim:'rgba(6,182,212,.12)',
   headline:(c)=>`Catastrophic flooding submerges ${c.warehouses[0]} and surrounding logistics routes`,
   impact:'$12M in inventory damaged. 3 major highways closed. Rail service suspended 4–6 weeks.',
   why:'Natural disasters destroy physical assets you can\'t move. Damaged inventory PLUS blocked logistics multiplies the harm.',
   effects:{cost:-20,inventory:-40,profit:-20,delivery:-32,satisfaction:-20}},
  {type:'Raw Material Shortage',emoji:'⛏️',urgency:'HIGH',color:'#ec4899',dim:'rgba(236,72,153,.12)',
   headline:(c)=>`Global shortage of critical materials drives input prices up 180%`,
   impact:'Spot prices at decade-high. Long-term contracts unavailable. Competitors hoarding. Production costs unsustainable.',
   why:'Raw material shortages create a bidding war. Your purchasing power is suddenly your most critical asset.',
   effects:{cost:-30,inventory:-18,profit:-32,delivery:-15,satisfaction:-15}},
  {type:'Trade Sanctions',emoji:'🌍',urgency:'HIGH',color:'#6366f1',dim:'rgba(99,102,241,.12)',
   headline:(c)=>`Trade sanctions imposed on ${c.countries[1]}, blocking critical imports`,
   impact:'18% of supply base suddenly non-compliant. Compliance exposure. Emergency re-sourcing required in 90 days.',
   why:'Geopolitical risk is the hardest to predict. Sanctions force you to rebuild supplier relationships under extreme time pressure.',
   effects:{cost:-15,inventory:-20,profit:-18,delivery:-20,satisfaction:-18}},
  {type:'Shipping Delay',emoji:'🚢',urgency:'MEDIUM',color:'#14b8a6',dim:'rgba(20,184,166,.12)',
   headline:(c)=>`Canal blockage creates 6–8 week delay on all Asia shipments`,
   impact:'Vessels rerouted via alternate route. 14-day extra transit added. Air freight costs 8× sea freight.',
   why:'Global shipping bottlenecks ripple through the entire supply chain. If your goods are on those ships, your customers wait.',
   effects:{cost:-12,inventory:-15,profit:-12,delivery:-45,satisfaction:-20}},
];

const ALL_ACTIONS=[
  {id:'a1',title:'Emergency Sourcing',emoji:'🔍',
   desc:'Rapidly qualify 3 backup suppliers and place emergency orders at premium pricing.',
   tradeoff:'Costs more now, but restores inventory fastest.',
   why:'Emergency sourcing is expensive but it\'s the fastest way to restore supply. Without it, inventory keeps falling.',
   effects:{cost:-12,inventory:25,profit:-10,delivery:15,satisfaction:10}},
  {id:'a2',title:'Activate Safety Stock',emoji:'📦',
   desc:'Deploy strategic reserve inventory held at your remote warehouse for exactly this scenario.',
   tradeoff:'Uses your buffer — a one-time relief that won\'t last forever.',
   why:'Safety stock is insurance you already paid for. Using it prevents stockouts now.',
   effects:{cost:-5,inventory:20,profit:-3,delivery:20,satisfaction:15}},
  {id:'a3',title:'Customer Prioritization',emoji:'🎯',
   desc:'Triage customers by revenue. Fulfill top 20% fully; delay everyone else with advance notice.',
   tradeoff:'Protects key revenue but risks long-tail customer churn.',
   why:'You can\'t serve everyone equally in a crisis. Protecting biggest revenue accounts keeps the business alive.',
   effects:{cost:-3,inventory:-5,profit:8,delivery:10,satisfaction:-10}},
  {id:'a4',title:'Crisis War Room',emoji:'🏛️',
   desc:'Assemble cross-functional team (ops, procurement, finance, comms) to coordinate response.',
   tradeoff:'Slows initial response but prevents costly mistakes and miscommunication.',
   why:'Uncoordinated crisis response is often worse than no response. A war room prevents duplicate effort.',
   effects:{cost:-6,inventory:5,profit:5,delivery:8,satisfaction:12}},
  {id:'a5',title:'Air Freight Surge',emoji:'✈️',
   desc:'Switch critical shipments from ocean/rail to air freight to compress lead times.',
   tradeoff:'Up to 8× more expensive but slashes delivery time by 70%.',
   why:'Air freight is the nuclear option — it works, but it destroys margins. Use for highest-priority shipments only.',
   effects:{cost:-20,inventory:10,profit:-18,delivery:30,satisfaction:20}},
  {id:'a6',title:'Production Rerouting',emoji:'🔄',
   desc:'Shift manufacturing loads to secondary facilities and contract manufacturers.',
   tradeoff:'Lower efficiency, but keeps production running.',
   why:'Distributing production across facilities reduces risk of any single point of failure crippling output.',
   effects:{cost:-15,inventory:15,profit:-12,delivery:12,satisfaction:8}},
  {id:'a7',title:'Proactive Customer Comms',emoji:'📢',
   desc:'Send honest, detailed updates to all affected customers before they ask.',
   tradeoff:'Temporarily hurts confidence but prevents angry surprises and builds long-term trust.',
   why:'Customers hate surprises more than bad news. Proactive communication signals competence and earns patience.',
   effects:{cost:-2,inventory:0,profit:-2,delivery:0,satisfaction:18}},
  {id:'a8',title:'Spot Market Buying',emoji:'📊',
   desc:'Purchase available inventory on commodity spot markets at current inflated prices.',
   tradeoff:'Expensive and speculative, but guarantees material availability.',
   why:'Spot markets let you buy now at a premium. Painful, but better than having nothing to sell.',
   effects:{cost:-18,inventory:22,profit:-16,delivery:8,satisfaction:5}},
  {id:'a9',title:'Demand Shaping',emoji:'📉',
   desc:'Offer discounts on products with available supply; slow down depleted SKUs with longer lead times.',
   tradeoff:'Reduces revenue short-term but balances demand to what you can actually fulfill.',
   why:'If you can\'t increase supply, reduce demand for constrained products. This protects service levels on what you CAN ship.',
   effects:{cost:-4,inventory:8,profit:-6,delivery:15,satisfaction:5}},
];

const NEG_ROUNDS=[
  {title:'Opening Offer',
   context:'Your backup supplier knows about your crisis — you have less leverage than usual. Goal: set the tone without revealing how urgent your situation is.',

const STEPS=['welcome','company','crisis','warroom','negotiation','ceo','ai','dashboard'];
const STEP_LABELS={company:'Company',crisis:'Crisis',warroom:'War Room',negotiation:'Negotiation',ceo:'CEO Boardroom',ai:'AI Strategy',dashboard:'Dashboard'};
let currentStep='welcome';

function goTo(step){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  el('screen-'+step).classList.add('active');
  currentStep=step;
  updateTopbar();
  window.scrollTo(0,0);
}

function updateTopbar(){
  const bar=el('topbar');
  if(currentStep==='welcome'){bar.style.display='none';return}
  bar.style.display='flex';
  const idx=STEPS.indexOf(currentStep);
  const stepsHtml=STEPS.slice(1).map((_,i)=>{
    const cls=i<idx-1?'done':i===idx-1?'active':'';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');
  el('topbar-steps').innerHTML=stepsHtml;
  el('topbar-label').textContent=(STEP_LABELS[currentStep]||'')+' • Step '+(idx)+'/'+( STEPS.length-1);
}

// ─── SCREEN: DASHBOARD ────────────────────────────────────────────────────────
function renderDashboard(){
  const efx=S.warEffects,neg=S.negState,ns=S.negScore,cs=S.ceoScore,ai=S.aiChoices;
  const c=S.company,cr=S.crisis;

  const resilienceScore=clamp(Math.round((efx.inventory+efx.delivery)/2*0.8+neg.leadTime*0.2));
  const costScore=clamp(Math.round(efx.cost*0.7+neg.price*0.3));
  const riskScore=clamp(Math.round(ns*0.5+cs*0.5));
  const satisfactionScore=clamp(Math.round(efx.satisfaction*0.7+neg.trust*0.15+cs*0.15));
  const leadershipScore=clamp(cs);
  const negScoreN=clamp(ns);
  const aiBonus=ai.reduce((s,a)=>s+Object.values(a.impact).reduce((x,v)=>x+v,0),0);
  const aiMatScore=clamp(Math.round(40+aiBonus*0.5));

  const overall=clamp(Math.round(resilienceScore*0.18+costScore*0.15+riskScore*0.15+satisfactionScore*0.18+leadershipScore*0.14+negScoreN*0.12+aiMatScore*0.08));

  const outcome=overall>=80?{title:'Crisis Contained ✅',sub:'Exceptional crisis management across all dimensions.',cls:'outcome-great',emoji:'🏆',color:'#10b981'}:
    overall>=65?{title:'Strong Recovery ✅',sub:'Above-average response with minor vulnerabilities.',cls:'outcome-good',emoji:'⭐',color:'#3b82f6'}:
    overall>=50?{title:'Partial Recovery ⚠️',sub:'Reasonable outcome, but some areas need improvement.',cls:'outcome-mid',emoji:'📈',color:'#f59e0b'}:
    overall>=35?{title:'Business Under Pressure ⚠️',sub:'The crisis exposed significant gaps in your supply chain.',cls:'outcome-bad',emoji:'⚠️',color:'#f97316'}:
    {title:'Major Operational Failure ❌',sub:'Critical decisions compounded the crisis. Significant restructuring needed.',cls:'outcome-fail',emoji:'💥',color:'#ef4444'};

  const scores=[
    {label:'Resilience',v:resilienceScore,icon:'🛡️',color:'#10b981',desc:'Ability to absorb and recover from the crisis'},
    {label:'Cost Control',v:costScore,icon:'💰',color:'#3b82f6',desc:'Financial efficiency throughout the crisis'},
    {label:'Risk Mgmt',v:riskScore,icon:'⚠️',color:'#8b5cf6',desc:'Proactive risk identification and mitigation'},
    {label:'Satisfaction',v:satisfactionScore,icon:'😊',color:'#06b6d4',desc:'Customer experience during the crisis'},
    {label:'Leadership',v:leadershipScore,icon:'👔',color:'#f97316',desc:'Executive decision-making quality'},
    {label:'Negotiation',v:negScoreN,icon:'🤝',color:'#ec4899',desc:'Supplier negotiation effectiveness'},
    {label:'AI Maturity',v:aiMatScore,icon:'🤖',color:'#6366f1',desc:'Strategic AI investment quality'},
  ];

  const sorted=[...scores].sort((a,b)=>b.v-a.v);
  const best=sorted[0],worst=sorted[sorted.length-1];

  const fbs={
    'Resilience':{h:'Your supply chain absorbed the shock impressively. You maintained operational continuity under extreme pressure.',l:'Your supply chain was brittle when tested. Increasing safety stock and backup supplier relationships would significantly improve resilience.'},
    'Cost Control':{h:'You managed costs masterfully — minimizing crisis-related spend without sacrificing critical operations.',l:'Cost decisions added unnecessary financial pressure. Cheaper options that compromise speed often cost more in the long run.'},
    'Risk Mgmt':{h:'Excellent risk awareness. You identified vulnerabilities early and made proactive decisions before problems compounded.',l:'Risk management gaps allowed the crisis to escalate further than necessary. Structured risk monitoring is critical.'},
    'Satisfaction':{h:'Your customers experienced minimal disruption — a remarkable achievement during a serious supply chain crisis.',l:'Customer satisfaction took a significant hit. Proactive communication and key account prioritization would have softened the blow.'},
    'Leadership':{h:'Your executive decisions reflected long-term, risk-adjusted thinking that separates great supply chain leaders from average ones.',l:'Leadership decisions often defaulted to short-term financial optics over strategic risk management.'},
    'Negotiation':{h:'You built genuine supplier partnership value — creating trust, favorable pricing, and delivery speed simultaneously.',l:'Negotiation left value on the table. Focusing only on price at the expense of trust often costs more in future crises.'},
    'AI Maturity':{h:'Strong AI investment choices that address the most impactful areas of supply chain intelligence.',l:'Consider more strategically targeted AI investments — visibility and prediction capabilities deliver the fastest ROI.'},
  };

  const recommendation=overall>=65?'Formalize the crisis response playbook you developed here. Document your action framework and run quarterly simulations to keep your team sharp.':
    overall>=45?'Your response had good instincts but lacked systematic execution. Invest in supplier risk monitoring and demand forecasting AI to reduce reactive decision-making.':
    'Significant gaps exist in supplier diversification, inventory strategy, and crisis communication. Begin with a formal supply chain risk assessment and resilience audit within 90 days.';

  const lesson=overall>=65?'Key lesson: systematic crisis response planning pays dividends disproportionate to its cost. The actions that felt "expensive" during the crisis were far cheaper than unmitigated disruption.':
    overall>=45?'Key lesson: in a crisis, speed of decision-making matters more than perfection. Build pre-approved decision trees for your most likely crisis scenarios.':
    'Key lesson: supply chain resilience must be built before the crisis hits. Once a crisis starts, your only options are damage control — real leverage is in risk management done during calm periods.';

  el('screen-dashboard').innerHTML=`
  <div class="container fade-in">
    <div class="section-header">
      <div class="section-eyebrow">Executive Dashboard</div>
      <h2 class="section-title">Final Crisis Assessment</h2>
      <p class="section-sub">${c.name} &nbsp;•&nbsp; ${c.industry} &nbsp;•&nbsp; Crisis: ${cr.type}</p>
    </div>

    <div class="outcome-banner ${outcome.cls}" style="margin-bottom:24px">
      <div style="font-size:52px;margin-bottom:8px">${outcome.emoji}</div>
      <div style="font-size:26px;font-weight:900;color:${outcome.color};margin-bottom:6px">${outcome.title}</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:20px">${outcome.sub}</div>
      <div style="display:flex;justify-content:center">${scoreRing(overall,140)}</div>
    </div>

    <div class="grid-4" style="margin-bottom:20px">
      ${scores.map(s=>`
        <div class="score-mini-card">
          <div style="font-size:20px;margin-bottom:6px">${s.icon}</div>
          <div style="font-family:monospace;font-size:22px;font-weight:800;color:${s.color};margin-bottom:4px">${s.v}</div>
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${s.label}</div>
          ${progressBar(s.v,s.color)}
        </div>`).join('')}
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title" style="margin-bottom:14px">📊 Score Breakdown & Reasoning</div>
      ${scores.map(s=>`
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div><span style="font-weight:700;font-size:13px">${s.icon} ${s.label}</span> <span style="font-size:12px;color:var(--text3)">${s.desc}</span></div>
            <span style="font-family:monospace;font-weight:700;color:${s.color};min-width:50px;text-align:right">${s.v}/100</span>
          </div>
          ${progressBar(s.v,s.color,true)}
          <div style="font-size:12px;color:var(--text3);margin-top:4px;line-height:1.5">${(fbs[s.label]||fbs['AI Maturity'])[s.v>=60?'h':'l']}</div>
        </div>`).join('')}
    </div>

    <div class="grid-2" style="margin-bottom:16px">
      <div class="card" style="border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)">
        <div class="card-title" style="color:var(--green2)">🏆 Best Decision Area</div>
        <div style="font-size:22px;font-weight:800;color:var(--green2);margin:8px 0">${best.icon} ${best.label}</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.6">${(fbs[best.label]||fbs['AI Maturity']).h}</div>
      </div>
      <div class="card" style="border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06)">
        <div class="card-title" style="color:var(--red2)">⚠️ Biggest Gap</div>
        <div style="font-size:22px;font-weight:800;color:var(--red2);margin:8px 0">${worst.icon} ${worst.label}</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.6">${(fbs[worst.label]||fbs['AI Maturity']).l}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title" style="margin-bottom:10px">🎓 Expert Recommendation</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:16px">${recommendation}</div>
      <div class="divider"></div>
      <div class="card-title" style="margin-bottom:8px">💡 Key Lesson from This Playthrough</div>
      <div style="font-size:14px;color:var(--text2);line-height:1.7">${lesson}</div>
    </div>

    <div class="card" style="margin-bottom:24px">
      <div class="card-title" style="margin-bottom:10px">🤖 AI Investment Summary</div>
      <div class="grid-2">
        ${ai.map(a=>`
          <div style="background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:16px">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
              <span style="font-size:20px">${a.emoji}</span>
              <div><div style="font-weight:700;font-size:13px">${a.name}</div><div style="font-size:11px;color:${a.color}">${a.roi}</div></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${Object.entries(a.impact).map(([k,v])=>`<span class="badge badge-green">+${v} ${k}</span>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div style="text-align:center;padding:28px 0">
      <div style="font-size:14px;color:var(--text3);margin-bottom:20px">Every playthrough randomizes the company, crisis, and outcomes. Try different strategies to see how scores change.</div>
      <button class="btn btn-primary btn-lg" id="btn-replay" style="margin-right:12px">🔄 Play Again</button>
      <button class="btn btn-secondary" id="btn-copy">📋 Copy Score</button>
    </div>
  </div>`;

  animateBars(el('screen-dashboard'));
  animateRings(el('screen-dashboard'));

  el('btn-replay').onclick=()=>{
    S.company=null;S.crisis=null;S.warActions=[];S.warEffects={cost:50,inventory:50,profit:50,delivery:50,satisfaction:50};
    S.negScore=0;S.negState={trust:50,price:50,leadTime:50};S.ceoScore=0;S.ceoAnswers=[];S.aiChoices=[];S.screenActions=[];
    renderWelcome();goTo('welcome');
  };
  el('btn-copy').onclick=()=>{
    const txt=`Operation Lifeline Score: ${overall}/100 — ${outcome.title} (${c.industry} • ${cr.type})`;
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert('Score copied!')).catch(()=>alert(txt))}else{alert(txt)};
  };
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
renderWelcome();
</script>
</body>
</html>

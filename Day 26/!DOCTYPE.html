<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prior Authorization Simulator - Premium Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B1220;
            --bg-secondary: #111827;
            --bg-tertiary: #1F2937;
            --bg-card: #1a1f2e;
            --border-color: #2d3748;
            --accent-blue: #3B82F6;
            --accent-cyan: #06B6D4;
            --accent-green: #22C55E;
            --accent-orange: #F59E0B;
            --accent-red: #EF4444;
            --text-primary: #F9FAFB;
            --text-secondary: #D1D5DB;
            --text-muted: #9CA3AF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a2847 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            padding: 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Main */
        .main-content {
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: 24px;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .metric-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-4px);
        }

        .metric-card:hover::before {
            opacity: 1;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .metric-unit {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Progress */
        .progress-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green) 0%, var(--accent-cyan) 100%);
            width: 0%;
            transition: width 0.6s ease-out;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        /* Buttons */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        button:hover::before {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            color: var(--text-primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent-green) 0%, #16a34a 100%);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 24px 0;
        }

        /* Workflow */
        .workflow-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .workflow-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .workflow-lanes {
            display: flex;
            gap: 16px;
            min-width: 100%;
        }

        .workflow-lane {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lane-header {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(6, 182, 212, 0.1) 100%);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-cyan);
        }

        .lane-content {
            background: var(--bg-tertiary);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 12px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }

        .lane-content.drag-over {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
            box-shadow: inset 0 0 10px rgba(6, 182, 212, 0.2);
        }

        .workflow-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            cursor: grab;
            transition: var(--transition);
            user-select: none;
        }

        .workflow-card:active {
            cursor: grabbing;
        }

        .workflow-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .workflow-card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-cyan);
        }

        /* Timeline */
        .timeline-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .timeline-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .timeline {
            display: flex;
            gap: 0;
            position: relative;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .timeline-stage {
            flex: 1;
            min-width: 110px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timeline-stage::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 55px;
            width: calc(100% - 20px);
            height: 2px;
            background: var(--border-color);
            z-index: 0;
        }

        .timeline-stage:last-child::after {
            display: none;
        }

        .timeline-stage.completed::after {
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .timeline-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: var(--transition);
        }

        .timeline-stage.completed .timeline-dot {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .timeline-stage.active .timeline-dot {
            background: var(--accent-blue);
            border-color: var(--accent-cyan);
            color: white;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .timeline-label {
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            color: var(--text-muted);
            max-width: 100px;
            word-break: break-word;
        }

        .timeline-days {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Documents */
        .documents-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .documents-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .documents-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .doc-info-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .doc-info-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 4px;
        }

        .doc-info-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .document-item {
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            cursor: grab;
            transition: var(--transition);
            user-select: none;
        }

        .document-item:active {
            cursor: grabbing;
        }

        .document-item:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .document-item.collected {
            border-color: var(--accent-green);
            background: rgba(34, 197, 94, 0.1);
            cursor: default;
        }

        .document-icon {
            font-size: 24px;
        }

        .document-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .document-check {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 14px;
        }

        .document-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* PA Package */
        .pa-package {
            background: var(--bg-tertiary);
            border: 2px dashed var(--accent-blue);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            min-height: 100px;
        }

        .pa-package-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 12px;
        }

        .pa-documents-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pa-doc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .pa-doc-item::before {
            content: '✓';
            color: var(--accent-green);
            font-weight: 700;
            font-size: 14px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease-out;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .modal-section-content {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .modal-list {
            list-style: none;
        }

        .modal-list li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .modal-list li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        /* Decision Banner */
        .decision-banner {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 700;
            border: 2px solid;
        }

        .decision-banner.approved {
            background: rgba(34, 197, 94, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .decision-banner.denied {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .decision-banner.pending {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Info Panel */
        .info-panel {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Gamification */
        .gamification-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .gami-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .gami-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .gami-icon {
            font-size: 32px;
        }

        .gami-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .gami-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .achievement-badge {
            display: inline-block;
            padding: 8px 12px;
            background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-cyan) 100%);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            margin: 4px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 2000;
        }

        /* Screens */
        .hidden {
            display: none !important;
        }

        /* Scenario Selection */
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .scenario-card {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scenario-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-4px);
        }

        .scenario-icon {
            font-size: 32px;
        }

        .scenario-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .scenario-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Analytics */
        .analytics-section {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin: 20px 0;
        }

        /* Summary */
        .summary-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 32px;
            max-width: 900px;
            margin: 0 auto 24px;
        }

        .summary-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .summary-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .summary-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .summary-section {
            margin-bottom: 24px;
        }

        .summary-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: var(--text-muted);
        }

        .summary-value {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .main-content {
                padding: 16px;
            }

            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .metric-value {
                font-size: 24px;
            }

            .workflow-lanes {
                flex-direction: column;
            }

            .workflow-lane {
                min-width: 100%;
            }

            .timeline {
                overflow-x: auto;
            }

            .documents-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .scenario-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px;
            }

            .gami-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 16px;
            }

            .header-title {
                font-size: 20px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .main-content {
                padding: 12px;
            }

            button {
                width: 100%;
                text-align: center;
            }

            .button-group {
                flex-direction: column;
            }

            .documents-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .metric-card {
                padding: 16px;
            }

            .metric-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div>
                    <div class="header-title">🏥 Prior Authorization Simulator</div>
                </div>
                <div class="header-actions">
                    <button class="btn-primary btn-small" id="startBtn">Start</button>
                    <button class="btn-secondary btn-small" id="resetBtn">Reset</button>
                    <button class="btn-secondary btn-small" id="printBtn">Print</button>
                </div>
            </div>
        </div>

        <!-- Main -->
        <div class="main-content">
            <!-- Scenario Selection Screen -->
            <div id="scenarioScreen">
                <div class="scenario-grid" id="scenarioGrid"></div>
            </div>

            <!-- Simulation Screen -->
            <div id="simulationScreen" class="hidden">
                <!-- Metrics -->
                <div class="dashboard-grid" id="metricsGrid"></div>

                <!-- Progress -->
                <div class="progress-section">
                    <div class="progress-label">
                        <span>Workflow Progress</span>
                        <span id="progressText">0/8 stages</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>

                <!-- Gamification -->
                <div class="gamification-section" id="gamificationSection">
                    <div class="workflow-title">Your Progress</div>
                    <div class="gami-grid" id="gamificationGrid"></div>
                </div>

                <!-- Timeline -->
                <div class="timeline-section">
                    <div class="timeline-title">Workflow Timeline</div>
                    <div class="timeline" id="timeline"></div>
                </div>

                <!-- Workflow -->
                <div class="workflow-section">
                    <div class="workflow-title">Processing Lanes</div>
                    <div class="workflow-lanes" id="workflowLanes"></div>
                </div>

                <!-- Documents -->
                <div class="documents-section">
                    <div class="documents-title">Document Collection</div>
                    <div class="documents-info" id="documentsInfo"></div>
                    <div class="documents-grid" id="documentsGrid"></div>
                    <div class="pa-package" id="paPackage">
                        <div class="pa-package-title">📦 Prior Authorization Package</div>
                        <div class="pa-documents-list" id="paDocuments"></div>
                    </div>
                </div>

                <!-- Medical Necessity -->
                <div class="analytics-section" id="medicalNecessitySection">
                    <div class="workflow-title">Medical Necessity Evaluation</div>
                    <div id="medicalNecessityContent"></div>
                </div>

                <!-- Controls -->
                <div class="button-group">
                    <button class="btn-primary" id="nextBtn">Next Stage</button>
                    <button class="btn-secondary" id="prevBtn">Previous Stage</button>
                    <button class="btn-success" id="submitBtn" style="display:none;">Submit to Payer</button>
                    <button class="btn-secondary" id="newBtn">New Patient</button>
                </div>
            </div>

            <!-- Summary Screen -->
            <div id="summaryScreen" class="hidden">
                <div class="summary-container" id="summaryContent"></div>
                <div class="button-group" style="justify-content: center;">
                    <button class="btn-primary" onclick="resetApp()">New Scenario</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Educational Modal -->
    <div class="modal" id="educationalModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Educational Content</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeModal()">Continue</button>
            </div>
        </div>
    </div>

    <!-- Decision Modal -->
    <div class="modal" id="decisionModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Payer Decision</div>
                <button class="modal-close" onclick="closeDecisionModal()">&times;</button>
            </div>
            <div id="decisionContent"></div>
            <div class="modal-footer">
                <button class="btn-primary" id="continueBtn" onclick="closeDecisionModal()">Continue</button>
            </div>
        </div>
    </div>

    <!-- Peer-to-Peer Modal -->
    <div class="modal" id="p2pModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Peer-to-Peer Review</div>
                <button class="modal-close" onclick="closeP2PModal()">&times;</button>
            </div>
            <div id="p2pContent"></div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="handleP2PResponse()">Submit Response</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== PATIENT SCENARIOS ====================
        const PATIENT_SCENARIOS = [
            {
                id: 1,
                name: 'Elective Surgery',
                icon: '🏥',
                patient: {
                    name: 'John Martinez',
                    age: 58,
                    diagnosis: 'Knee osteoarthritis with meniscal tear',
                    service: 'Arthroscopic knee surgery'
                },
                documents: ['Physician Notes', 'MRI Report', 'Treatment History', 'Clinical Guidelines', 'Insurance Form'],
                baseApprovalChance: 0.70,
                complexity: 'medium',
                scenarioType: 'elective'
            },
            {
                id: 2,
                name: 'Diagnostic Imaging',
                icon: '🧠',
                patient: {
                    name: 'Sarah Chen',
                    age: 42,
                    diagnosis: 'Suspected multiple sclerosis',
                    service: 'Brain MRI with contrast'
                },
                documents: ['Physician Notes', 'Lab Results', 'Symptoms', 'Exam Notes', 'Insurance Form'],
                baseApprovalChance: 0.85,
                complexity: 'low',
                scenarioType: 'diagnostic'
            },
            {
                id: 3,
                name: 'Specialty Medication',
                icon: '💊',
                patient: {
                    name: 'Michael Rodriguez',
                    age: 35,
                    diagnosis: 'Cystic fibrosis with CFTR modulator candidacy',
                    service: 'Ivacaftor (Kalydeco) therapy'
                },
                documents: ['Physician Notes', 'Lab Results', 'Genetic Testing', 'Clinical Guidelines', 'Drug Form', 'Previous Treatment'],
                baseApprovalChance: 0.65,
                complexity: 'high',
                scenarioType: 'specialty'
            },
            {
                id: 4,
                name: 'Emergency Admission',
                icon: '🚑',
                patient: {
                    name: 'Elizabeth Thompson',
                    age: 67,
                    diagnosis: 'Acute decompensated heart failure',
                    service: 'Inpatient hospitalization'
                },
                documents: ['ED Notes', 'Lab Results', 'EKG', 'Admission Documentation', 'Insurance Form'],
                baseApprovalChance: 0.95,
                complexity: 'auto',
                scenarioType: 'emergency'
            }
        ];

        const WORKFLOW_STAGES = [
            { id: 'registration', name: 'Patient Registration', icon: '👤', days: 1 },
            { id: 'evaluation', name: 'Provider Evaluation', icon: '👨‍⚕️', days: 1 },
            { id: 'necessity_review', name: 'Medical Necessity Review', icon: '📋', days: 2 },
            { id: 'document_collection', name: 'Document Collection', icon: '📄', days: 1 },
            { id: 'pa_request', name: 'PA Request Creation', icon: '📝', days: 1 },
            { id: 'submission', name: 'Payer Submission', icon: '📤', days: 1 },
            { id: 'payer_review', name: 'Payer Review', icon: '🔍', days: 2 },
            { id: 'decision', name: 'Decision', icon: '✓', days: 0 }
        ];

        const ACHIEVEMENTS = {
            'perfect_run': { name: '⭐ Perfect Run', desc: 'Complete workflow without errors', xp: 500 },
            'speed_demon': { name: '⚡ Speed Demon', desc: 'Complete in under 7 days', xp: 300 },
            'completionist': { name: '📚 Completionist', desc: 'Collect all documents', xp: 250 },
            'approval_master': { name: '✓ Approval Master', desc: 'Get approved on first try', xp: 400 },
            'documents_expert': { name: '📋 Documents Expert', desc: 'Submit 5+ complete workflows', xp: 600 }
        };

        // ==================== STATE ====================
        let appState = {
            currentScenario: null,
            currentStageIndex: 0,
            collectedDocuments: [],
            workflowState: {},
            startDate: null,
            currentDecision: null,
            medicalNecessityScore: 0,
            efficiencyScore: 100,
            daysElapsed: 0,
            xp: 0,
            achievements: [],
            appealAttempts: 0,
            p2pCalled: false,
            completedWorkflows: 0,
            decisionHistory: []
        };

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            renderScenarioSelection();
        });

        function setupEventListeners() {
            document.getElementById('startBtn').addEventListener('click', showSimulation);
            document.getElementById('resetBtn').addEventListener('click', resetApp);
            document.getElementById('printBtn').addEventListener('click', printWorkflow);
            document.getElementById('nextBtn').addEventListener('click', nextStage);
            document.getElementById('prevBtn').addEventListener('click', previousStage);
            document.getElementById('submitBtn').addEventListener('click', submitToPayer);
            document.getElementById('newBtn').addEventListener('click', resetApp);
        }

        function renderScenarioSelection() {
            const grid = document.getElementById('scenarioGrid');
            grid.innerHTML = PATIENT_SCENARIOS.map((scenario, idx) => `
                <div class="scenario-card" onclick="selectScenario(${idx})">
                    <div class="scenario-icon">${scenario.icon}</div>
                    <div class="scenario-title">${scenario.name}</div>
                    <div class="scenario-desc">
                        ${scenario.patient.name}, ${scenario.patient.age}<br>
                        ${scenario.patient.diagnosis}
                    </div>
                </div>
            `).join('');
        }

        function selectScenario(index) {
            appState.currentScenario = PATIENT_SCENARIOS[index];
            appState.currentStageIndex = 0;
            appState.collectedDocuments = [];
            appState.startDate = new Date();
            appState.currentDecision = null;
            appState.medicalNecessityScore = 0;
            appState.efficiencyScore = 100;
            appState.daysElapsed = 0;
            appState.appealAttempts = 0;
            appState.p2pCalled = false;

            document.getElementById('scenarioScreen').classList.add('hidden');
            document.getElementById('simulationScreen').classList.remove('hidden');
            document.getElementById('summaryScreen').classList.add('hidden');

            initializeWorkflow();
            updateAllUI();
            showEducationalModal(0);
        }

        function initializeWorkflow() {
            appState.workflowState = {
                patient_registered: false,
                provider_evaluated: false,
                medical_necessity_reviewed: false,
                documents_collected: false,
                pa_request_created: false,
                submitted_to_payer: false,
                payer_reviewed: false,
                decision_made: false
            };
        }

        function updateAllUI() {
            updateMetrics();
            updateProgress();
            updateTimeline();
            updateWorkflowLanes();
            updateDocuments();
            updateMedicalNecessity();
            updateGamification();
        }

        function updateMetrics() {
            const scenario = appState.currentScenario;
            const patient = scenario.patient;
            const stage = WORKFLOW_STAGES[appState.currentStageIndex];

            const daysElapsed = calculateBusinessDays();

            const metrics = [
                { label: 'Patient', value: patient.name },
                { label: 'Diagnosis', value: patient.diagnosis.substring(0, 30) + '...' },
                { label: 'Status', value: stage.name, color: true },
                { label: 'Days Elapsed', value: daysElapsed, unit: 'business days' },
                { label: 'Progress', value: Math.round((appState.currentStageIndex / WORKFLOW_STAGES.length) * 100) + '%' },
                { label: 'Documents', value: appState.collectedDocuments.length + '/' + scenario.documents.length },
                { label: 'Medical Necessity', value: Math.round(appState.medicalNecessityScore) + '%' },
                { label: 'Efficiency Score', value: Math.round(appState.efficiencyScore), unit: '/100' }
            ];

            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = metrics.map(m => `
                <div class="metric-card">
                    <div class="metric-label">${m.label}</div>
                    <div class="metric-value">${m.value}</div>
                    ${m.unit ? `<div class="metric-unit">${m.unit}</div>` : ''}
                </div>
            `).join('');
        }

        function updateProgress() {
            const progress = (appState.currentStageIndex / WORKFLOW_STAGES.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${appState.currentStageIndex}/${WORKFLOW_STAGES.length} stages`;
        }

        function updateTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = WORKFLOW_STAGES.map((stage, idx) => {
                let className = 'timeline-stage';
                if (idx < appState.currentStageIndex) className += ' completed';
                if (idx === appState.currentStageIndex) className += ' active';

                return `
                    <div class="${className}">
                        <div class="timeline-dot">${idx + 1}</div>
                        <div class="timeline-label">${stage.name}</div>
                        <div class="timeline-days">${stage.days}d</div>
                    </div>
                `;
            }).join('');
        }

        function updateWorkflowLanes() {
            const lanes = [
                {
                    name: 'Patient',
                    items: [
                        { id: 'registration', title: 'Registration', status: appState.workflowState.patient_registered ? 'completed' : 'pending' }
                    ]
                },
                {
                    name: 'Provider',
                    items: [
                        { id: 'evaluation', title: 'Medical Evaluation', status: appState.workflowState.provider_evaluated ? 'completed' : 'pending' },
                        { id: 'necessity', title: 'Necessity Review', status: appState.workflowState.medical_necessity_reviewed ? 'completed' : 'pending' }
                    ]
                },
                {
                    name: 'Payer',
                    items: [
                        { id: 'submission', title: 'Received Submission', status: appState.workflowState.submitted_to_payer ? 'completed' : 'pending' },
                        { id: 'review', title: 'Payer Review', status: appState.workflowState.payer_reviewed ? 'completed' : 'pending' },
                        { id: 'decision', title: 'Decision', status: appState.workflowState.decision_made ? 'completed' : 'pending' }
                    ]
                }
            ];

            const container = document.getElementById('workflowLanes');
            container.innerHTML = lanes.map(lane => `
                <div class="workflow-lane">
                    <div class="lane-header">${lane.name}</div>
                    <div class="lane-content" data-lane="${lane.name}">
                        ${lane.items.map(item => `
                            <div class="workflow-card" draggable="true" data-id="${item.id}">
                                <div class="card-title">${item.title}</div>
                                <div class="card-status">${item.status === 'completed' ? '✓ Completed' : '⏳ Pending'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            setupDragDrop();
        }

        function setupDragDrop() {
            const cards = document.querySelectorAll('.workflow-card');
            const lanes = document.querySelectorAll('.lane-content');

            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('cardId', card.dataset.id);
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                });
            });

            lanes.forEach(lane => {
                lane.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    lane.classList.add('drag-over');
                });

                lane.addEventListener('dragleave', () => {
                    lane.classList.remove('drag-over');
                });

                lane.addEventListener('drop', (e) => {
                    e.preventDefault();
                    lane.classList.remove('drag-over');
                    
                    const cardId = e.dataTransfer.getData('cardId');
                    const draggedCard = document.querySelector(`[data-id="${cardId}"]`);
                    if (draggedCard) {
                        lane.appendChild(draggedCard);
                    }
                });
            });
        }

        function updateDocuments() {
            const scenario = appState.currentScenario;
            const required = scenario.documents.length;
            const collected = appState.collectedDocuments.length;
            const missing = required - collected;

            document.getElementById('documentsInfo').innerHTML = `
                <div class="doc-info-card">
                    <div class="doc-info-value">${collected}</div>
                    <div class="doc-info-label">Collected</div>
                </div>
                <div class="doc-info-card">
                    <div class="doc-info-value">${missing}</div>
                    <div class="doc-info-label">Missing</div>
                </div>
                <div class="doc-info-card">
                    <div class="doc-info-value">${Math.round((collected / required) * 100)}%</div>
                    <div class="doc-info-label">Completion</div>
                </div>
            `;

            const grid = document.getElementById('documentsGrid');
            grid.innerHTML = scenario.documents.map(doc => {
                const collected = appState.collectedDocuments.includes(doc);
                return `
                    <div class="document-item ${collected ? 'collected' : ''}" 
                         draggable="true" 
                         data-doc="${doc}"
                         ondragstart="dragDocument(event)"
                         ondragend="dragDocumentEnd(event)"
                         ${!collected ? `onclick="collectDocument('${doc}')"` : ''}>
                        <div class="document-icon">📄</div>
                        <div class="document-name">${doc}</div>
                        ${collected ? '<div class="document-check">✓</div>' : ''}
                    </div>
                `;
            }).join('');

            updatePAPackage();
        }

        function collectDocument(doc) {
            if (!appState.collectedDocuments.includes(doc)) {
                appState.collectedDocuments.push(doc);
                appState.efficiencyScore = Math.max(50, appState.efficiencyScore - 2);
                updateDocuments();
                updateMetrics();
            }
        }

        function dragDocument(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('docName', e.target.dataset.doc);
        }

        function dragDocumentEnd(e) {
            e.target.classList.remove('dragging');
        }

        function updatePAPackage() {
            const list = document.getElementById('paDocuments');
            if (appState.collectedDocuments.length > 0) {
                list.innerHTML = appState.collectedDocuments.map(doc => 
                    `<div class="pa-doc-item">${doc}</div>`
                ).join('');
            } else {
                list.innerHTML = '<div style="color: var(--text-muted); font-size: 12px;">Drag documents here to build your package</div>';
            }
        }

        function updateMedicalNecessity() {
            const scenario = appState.currentScenario;
            const docRate = (appState.collectedDocuments.length / scenario.documents.length) * 100;
            const stageBonus = appState.currentStageIndex * 8;

            appState.medicalNecessityScore = Math.min(100, docRate * 0.5 + stageBonus);

            const factors = [
                { name: 'Documentation Completeness', value: Math.round(docRate) + '%', weight: 0.4 },
                { name: 'Clinical Evidence', value: Math.round(appState.medicalNecessityScore * 0.7) + '%', weight: 0.3 },
                { name: 'Guideline Alignment', value: Math.round(appState.medicalNecessityScore * 0.8) + '%', weight: 0.3 }
            ];

            const content = document.getElementById('medicalNecessityContent');
            content.innerHTML = `
                <div style="margin-bottom: 16px;">
                    <div style="font-size: 20px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 8px;">
                        Overall Score: ${Math.round(appState.medicalNecessityScore)}%
                    </div>
                    <div style="width: 100%; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color);">
                        <div style="width: ${appState.medicalNecessityScore}%; height: 100%; background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan)); box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);"></div>
                    </div>
                </div>
                ${factors.map(f => `
                    <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 12px;">
                        <span>${f.name}</span>
                        <span style="color: var(--accent-cyan); font-weight: 700;">${f.value}</span>
                    </div>
                `).join('')}
            `;
        }

        function updateGamification() {
            const xpPerStage = 100;
            appState.xp = appState.currentStageIndex * xpPerStage + Math.round(appState.efficiencyScore * 10);

            const grid = document.getElementById('gamificationGrid');
            grid.innerHTML = `
                <div class="gami-card">
                    <div class="gami-icon">⭐</div>
                    <div class="gami-value">${Math.round(appState.xp)}</div>
                    <div class="gami-label">Experience Points</div>
                </div>
                <div class="gami-card">
                    <div class="gami-icon">🏆</div>
                    <div class="gami-value">${appState.achievements.length}</div>
                    <div class="gami-label">Achievements</div>
                </div>
                <div class="gami-card">
                    <div class="gami-icon">📊</div>
                    <div class="gami-value">L${Math.floor(appState.xp / 500) + 1}</div>
                    <div class="gami-label">Workflow Level</div>
                </div>
                <div class="gami-card">
                    <div class="gami-icon">✓</div>
                    <div class="gami-value">${appState.completedWorkflows}</div>
                    <div class="gami-label">Completed</div>
                </div>
            `;

            if (appState.achievements.length > 0) {
                const section = document.getElementById('gamificationSection');
                const badges = appState.achievements.map(ach => 
                    `<span class="achievement-badge">${ACHIEVEMENTS[ach].name}</span>`
                ).join('');
                section.innerHTML += `<div style="margin-top: 16px;">${badges}</div>`;
            }
        }

        function nextStage() {
            const stage = WORKFLOW_STAGES[appState.currentStageIndex];
            
            // Verify stage requirements
            if (appState.currentStageIndex === 3 && appState.collectedDocuments.length < appState.currentScenario.documents.length * 0.6) {
                alert('Please collect at least 60% of documents before proceeding.');
                return;
            }

            if (appState.currentStageIndex < WORKFLOW_STAGES.length - 1) {
                appState.currentStageIndex++;
                updateStageState();
                updateAllUI();
                showEducationalModal(appState.currentStageIndex);

                if (appState.currentStageIndex === WORKFLOW_STAGES.length - 1) {
                    document.getElementById('nextBtn').style.display = 'none';
                    document.getElementById('submitBtn').style.display = 'flex';
                }
            }
        }

        function previousStage() {
            if (appState.currentStageIndex > 0) {
                appState.currentStageIndex--;
                updateAllUI();
                document.getElementById('submitBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'flex';
            }
        }

        function updateStageState() {
            const stageId = WORKFLOW_STAGES[appState.currentStageIndex].id;
            
            switch(stageId) {
                case 'registration':
                    appState.workflowState.patient_registered = true;
                    break;
                case 'evaluation':
                    appState.workflowState.provider_evaluated = true;
                    break;
                case 'necessity_review':
                    appState.workflowState.medical_necessity_reviewed = true;
                    break;
                case 'document_collection':
                    appState.workflowState.documents_collected = true;
                    break;
                case 'pa_request':
                    appState.workflowState.pa_request_created = true;
                    break;
                case 'submission':
                    appState.workflowState.submitted_to_payer = true;
                    break;
                case 'payer_review':
                    appState.workflowState.payer_reviewed = true;
                    break;
                case 'decision':
                    appState.workflowState.decision_made = true;
                    break;
            }
        }

        function submitToPayer() {
            const docRate = (appState.collectedDocuments.length / appState.currentScenario.documents.length) * 100;
            generateDecision(docRate);
            showDecisionModal();
        }

        function generateDecision(docRate) {
            const scenario = appState.currentScenario;
            const medNecessity = appState.medicalNecessityScore;

            let approvalChance = scenario.baseApprovalChance;

            // Adjust based on documentation
            if (docRate >= 90) approvalChance += 0.15;
            else if (docRate >= 70) approvalChance += 0.08;
            else if (docRate < 50) approvalChance -= 0.20;

            // Adjust based on medical necessity
            if (medNecessity >= 80) approvalChance += 0.10;
            else if (medNecessity < 40) approvalChance -= 0.15;

            // Scenario-specific adjustments
            if (scenario.scenarioType === 'emergency') {
                approvalChance = 0.98;
            } else if (scenario.scenarioType === 'diagnostic') {
                approvalChance += 0.10;
            } else if (scenario.scenarioType === 'specialty') {
                approvalChance -= 0.15;
            }

            approvalChance = Math.max(0.1, Math.min(0.98, approvalChance));

            const rand = Math.random();
            let outcome;

            if (rand < approvalChance) {
                outcome = 'Approval';
            } else if (rand < approvalChance + 0.15) {
                outcome = 'Pending';
            } else if (rand < approvalChance + 0.20) {
                outcome = 'Peer-to-Peer Review Required';
                appState.p2pCalled = true;
            } else {
                outcome = 'Denial';
            }

            appState.currentDecision = {
                outcome: outcome,
                approvalChance: Math.round(approvalChance * 100),
                reason: generateDecisionReason(outcome, docRate, medNecessity),
                documentation: docRate,
                medicalNecessity: medNecessity
            };

            appState.decisionHistory.push({
                date: new Date(),
                decision: outcome,
                reason: appState.currentDecision.reason
            });
        }

        function generateDecisionReason(outcome, docRate, medNecessity) {
            const reasons = {
                'Approval': `Your comprehensive documentation (${Math.round(docRate)}%) and strong medical necessity score (${Math.round(medNecessity)}%) support approval for the requested service.`,
                'Pending': `We require additional clinical documentation to complete our review. Please submit the missing items within 5 business days.`,
                'Peer-to-Peer Review Required': `A physician-to-physician discussion is recommended to clarify clinical details. This typically increases approval likelihood.`,
                'Denial': `Insufficient documentation and/or medical necessity evidence. Review denial reason and consider appeal process.`
            };
            return reasons[outcome];
        }

                    </div>`

                        <div class="modal-section-title">Why This Matters</div>

                    </div>
                    <div class="modal-section">
                        <div class="modal-section-title">Key Actions</div>

        function closeModal() {
            document.getElementById('educationalModal').classList.remove('active');
        }

        function showDecisionModal() {
            const decision = appState.currentDecision;
            const content = document.getElementById('decisionContent');

            const bannerClass = decision.outcome === 'Approval' ? 'approved' : 
                               decision.outcome.includes('Pending') ? 'pending' : 'denied';

            let html = `
                <div class="decision-banner ${bannerClass}">
                    <div style="font-size: 28px; margin-bottom: 8px;">
                        ${decision.outcome === 'Approval' ? '✓' : 
                          decision.outcome.includes('Pending') ? '⏳' : '❌'}
                    </div>
                    <div style="font-size: 20px;">${decision.outcome}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Decision Reason</div>
                    <div class="modal-section-content">${decision.reason}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Analysis</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;">
                        <div style="background: var(--bg-tertiary); padding: 12px; border-radius: 8px;">
                            <div style="font-size: 12px; color: var(--text-muted);">Documentation Rate</div>
                            <div style="font-size: 18px; font-weight: 700; color: var(--accent-cyan);">${Math.round(decision.documentation)}%</div>
                        </div>
                        <div style="background: var(--bg-tertiary); padding: 12px; border-radius: 8px;">
                            <div style="font-size: 12px; color: var(--text-muted);">Medical Necessity</div>
                            <div style="font-size: 18px; font-weight: 700; color: var(--accent-cyan);">${Math.round(decision.medicalNecessity)}%</div>
                        </div>
                    </div>
                </div>
            `;

            if (decision.outcome === 'Approval') {
                html += `<div class="info-panel">✓ Your service is approved! Schedule within authorization period.</div>`;
                appState.achievements.push('approval_master');
                animateConfetti();
            } else if (decision.outcome.includes('Peer-to-Peer')) {
                html += `<div class="info-panel">Schedule a peer-to-peer discussion with the medical reviewer to discuss clinical details.</div>`;
            } else if (decision.outcome === 'Pending') {
                html += `<div class="info-panel">Submit additional documentation to support your request within 5 business days.</div>`;
            } else {
                html += `<div class="info-panel">Consider filing an appeal with additional clinical evidence or documentation.</div>`;
            }

            content.innerHTML = html;

            if (decision.outcome === 'Peer-to-Peer Review Required') {
                document.getElementById('continueBtn').textContent = 'Schedule P2P Review';
                document.getElementById('continueBtn').onclick = showP2PModal;
            } else {
                document.getElementById('continueBtn').textContent = 'Continue';
                document.getElementById('continueBtn').onclick = closeDecisionModal;
            }

            document.getElementById('decisionModal').classList.add('active');
        }

        function closeDecisionModal() {
            document.getElementById('decisionModal').classList.remove('active');
            completeWorkflow();
        }

        function showP2PModal() {
            const questions = [
                'What specific clinical findings support the medical necessity for this procedure?',
                'Are there any contraindications for conservative treatment?',
                'What is the timeline for symptom progression?',
                'Have all guideline-recommended treatment options been exhausted?'
            ];

            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];

            document.getElementById('p2pContent').innerHTML = `
                <div class="modal-section">
                    <div class="modal-section-title">Physician Review Question</div>
                    <div class="modal-section-content" style="font-size: 14px; font-weight: 500;">"${randomQuestion}"</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Your Response</div>
                    <textarea id="p2pResponse" style="
                        width: 100%;
                        padding: 12px;
                        background: var(--bg-tertiary);
                        border: 1px solid var(--border-color);
                        border-radius: 8px;
                        color: var(--text-primary);
                        font-family: inherit;
                        font-size: 13px;
                        min-height: 80px;
                        resize: none;
                    " placeholder="Provide your clinical response..."></textarea>
                </div>
            `;

            document.getElementById('p2pModal').classList.add('active');
        }

        function handleP2PResponse() {
            const response = document.getElementById('p2pResponse').value;
            closeP2PModal();

            if (response.length > 50) {
                appState.currentDecision.outcome = 'Approval';
                appState.currentDecision.reason = 'Peer-to-peer discussion provided strong clinical justification for approval.';
                animateConfetti();
            }

            showDecisionModal();
        }

        function closeP2PModal() {
            document.getElementById('p2pModal').classList.remove('active');
            document.getElementById('decisionModal').classList.remove('active');
        }

        function completeWorkflow() {
            appState.completedWorkflows++;
            const daysTotal = calculateBusinessDays();
            
            checkAchievements(daysTotal);
            showWorkflowSummary(daysTotal);
        }

        function calculateBusinessDays() {
            if (!appState.startDate) return 0;
            const totalDays = Math.ceil((new Date() - appState.startDate) / (1000 * 60 * 60 * 24));
            return Math.max(appState.currentStageIndex, totalDays);
        }

        function checkAchievements(daysTotal) {
            const docRate = (appState.collectedDocuments.length / appState.currentScenario.documents.length) * 100;

            if (appState.efficiencyScore === 100 && appState.currentDecision.outcome === 'Approval') {
                appState.achievements.push('perfect_run');
            }
            if (daysTotal < 7) {
                appState.achievements.push('speed_demon');
            }
            if (docRate === 100) {
                appState.achievements.push('completionist');
            }
        }

        function showWorkflowSummary(daysTotal) {
            document.getElementById('simulationScreen').classList.add('hidden');
            document.getElementById('summaryScreen').classList.remove('hidden');

            const scenario = appState.currentScenario;
            const patient = scenario.patient;
            const docRate = Math.round((appState.collectedDocuments.length / scenario.documents.length) * 100);

            const summary = document.getElementById('summaryContent');
            summary.innerHTML = `
                <div class="summary-header">
                    <div class="summary-title">
                        ${appState.currentDecision.outcome === 'Approval' ? '✓ Approved' : appState.currentDecision.outcome}
                    </div>
                    <div class="summary-subtitle">${scenario.name} - ${patient.name}</div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Scenario Information</div>
                    <div class="summary-item">

                        <span class="summary-value">${patient.name}, ${patient.age}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Diagnosis</span>

                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Requested Service</span>
                        <span class="summary-value">${patient.service}</span>
                    </div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Workflow Results</div>
                    <div class="summary-item">
                        <span class="summary-label">Total Days</span>
                        <span class="summary-value">${daysTotal} business days</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Documents Collected</span>
                        <span class="summary-value">${appState.collectedDocuments.length}/${scenario.documents.length}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Documentation Rate</span>
                        <span class="summary-value">${docRate}%</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Medical Necessity Score</span>
                        <span class="summary-value">${Math.round(appState.medicalNecessityScore)}%</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Efficiency Score</span>
                        <span class="summary-value">${Math.round(appState.efficiencyScore)}/100</span>
                    </div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Final Decision</div>
                    <div class="summary-item">
                        <span class="summary-label">Outcome</span>
                        <span class="summary-value" style="color: ${appState.currentDecision.outcome === 'Approval' ? 'var(--accent-green)' : 'var(--accent-orange)'};">
                            ${appState.currentDecision.outcome}
                        </span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Reason</span>
                        <span class="summary-value">${appState.currentDecision.reason}</span>
                    </div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Your Achievements</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        ${appState.achievements.length > 0 ? 
                            appState.achievements.map(ach => 
                                `<span class="achievement-badge">${ACHIEVEMENTS[ach].name}</span>`
                            ).join('') : 
                            '<span style="color: var(--text-muted);">No achievements this time</span>'
                        }
                    </div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Experience Earned</div>
                    <div class="summary-item">
                        <span class="summary-label">Total XP</span>
                        <span class="summary-value">${Math.round(appState.xp)}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Level</span>
                        <span class="summary-value">L${Math.floor(appState.xp / 500) + 1}</span>
                    </div>
                </div>

                <div class="summary-section">
                    <div class="summary-section-title">Key Takeaways</div>
                    <div class="info-panel">
                        Documentation completeness at ${docRate}% ${docRate >= 80 ? 'strongly supported' : 'limited'} approval chances. Aim for 90%+ documentation rate.
                    </div>
                    <div class="info-panel">
                        Your workflow took ${daysTotal} days. Industry average: 5-10 business days.
                    </div>
                    <div class="info-panel">
                        ${appState.currentDecision.outcome === 'Approval' ? 'Great work! Schedule your service within the authorization period.' : 'Review denial reason and consider appeal options.'}
                    </div>
                </div>
            `;
        }

        function showSimulation() {
            renderScenarioSelection();
            document.getElementById('scenarioScreen').classList.remove('hidden');
        }

        function resetApp() {
            appState = {
                currentScenario: null,
                currentStageIndex: 0,
                collectedDocuments: [],
                workflowState: {},
                startDate: null,
                currentDecision: null,
                medicalNecessityScore: 0,
                efficiencyScore: 100,
                daysElapsed: 0,
                xp: 0,
                achievements: [],
                appealAttempts: 0,
                p2pCalled: false,
                completedWorkflows: appState.completedWorkflows,
                decisionHistory: []
            };

            document.getElementById('scenarioScreen').classList.remove('hidden');
            document.getElementById('simulationScreen').classList.add('hidden');
            document.getElementById('summaryScreen').classList.add('hidden');

            renderScenarioSelection();
        }

        function animateConfetti() {
            const colors = [
                'var(--accent-green)',
                'var(--accent-cyan)',
                'var(--accent-blue)',
                'var(--accent-orange)'
            ];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    document.body.appendChild(confetti);

                    const duration = 2000 + Math.random() * 1000;
                    const fall = setInterval(() => {
                        const top = parseFloat(confetti.style.top);
                        confetti.style.top = (top + 5) + 'px';
                        confetti.style.opacity = Math.max(0, 1 - (Date.now() % duration) / duration);

                        if (top > window.innerHeight) {
                            clearInterval(fall);
                            confetti.remove();
                        }
                    }, 30);
                }, i * 50);
            }
        }

        function printWorkflow() {
            window.print();
        }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root{
    --bg:#12151a;
    --bg-elev:#181c23;
    --surface:#1e232b;
    --surface-hi:#262c36;
    --border:#2c323d;
    --border-soft:#232833;
    --accent:#e8a33d;
    --accent-dim:#c98a2c;
    --accent-soft:rgba(232,163,61,0.14);
    --teal:#3fb9a8;
    --teal-soft:rgba(63,185,168,0.14);
    --red:#e1585c;
    --red-soft:rgba(225,88,92,0.14);
    --text:#edeef1;
    --text-dim:#9aa1ad;
    --text-faint:#616974;
    --display:'Inter',-apple-system,sans-serif;
    --body:'Inter',-apple-system,sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 85% -10%, rgba(232,163,61,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(63,185,168,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  ::selection{background:var(--accent-soft); color:var(--accent);}
  a{color:inherit;}
  button{font-family:var(--body); cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}

  .app-shell{display:flex; min-height:100vh;}
  .console-rail{
    width:230px; flex-shrink:0; background:var(--bg-elev);
    border-right:1px solid var(--border-soft);
    padding:22px 16px; display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .console-brand{display:flex; align-items:center; gap:10px; padding:0 4px 12px; border-bottom:1px solid var(--border-soft);}
  .console-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#1a1206;flex-shrink:0;}
  .console-title{font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); line-height:1.4;}
  .console-title b{display:block; color:var(--text); font-size:12.5px;}
  .gauge-list{display:flex; flex-direction:column; gap:14px;}
  .gauge-row{display:flex; align-items:center; gap:12px;}
  .gauge-info{flex:1; min-width:0;}
  .gauge-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:5px;}
  .gauge-track{height:6px; border-radius:4px; background:var(--surface-hi); overflow:hidden;}
  .gauge-fill{height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); transition:width 0.8s cubic-bezier(.22,1,.36,1);}
  .gauge-num{font-family:var(--mono); font-size:12px; color:var(--text); width:30px; text-align:right; flex-shrink:0;}
  .console-stage{margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft);}
  .console-stage-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:6px;}
  .console-stage-name{font-family:var(--display); font-size:13.5px; color:var(--accent); font-weight:600;}

  .console-rail-mobile{display:none;}

  .main-area{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:none;
  }
  .stage-wrap{flex:1; padding:38px 44px 70px; max-width:980px; margin:0 auto; width:100%;}
  @media (max-width:980px){
    .stage-wrap{padding:26px 20px 60px;}
  }
  @media (max-width:860px){
    .console-rail{display:none;}
    .console-rail-mobile{
      display:flex; position:sticky; top:0; z-index:20;
      background:var(--bg-elev); border-bottom:1px solid var(--border-soft);
      padding:10px 16px; gap:8px; overflow-x:auto;
    }
    .gauge-chip{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 10px; white-space:nowrap; display:flex; gap:6px; align-items:center;}
    .gauge-chip b{color:var(--accent); font-weight:600;}
  }

  .eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .eyebrow::before{content:''; width:16px; height:1px; background:var(--accent);}
  h1.page-title{font-family:var(--display); font-size:clamp(28px,4vw,42px); font-weight:700; line-height:1.08; margin:0 0 14px; letter-spacing:-0.01em;}
  h2.section-title{font-family:var(--display); font-size:24px; font-weight:600; margin:0 0 10px; letter-spacing:-0.01em;}
  h3.card-title{font-family:var(--display); font-size:17px; font-weight:600; margin:0 0 6px;}
  p.lede{font-size:16px; line-height:1.65; color:var(--text-dim); max-width:640px; margin:0 0 24px;}
  p.body-text{font-size:14.5px; line-height:1.7; color:var(--text-dim);}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px;}
  .panel-tight{padding:16px 18px;}
  .info-block{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0;}
  @media (max-width:640px){.info-block{grid-template-columns:1fr;}}
  .info-item{background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:14px 16px;}
  .info-item .lbl{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:6px;}
  .info-item .val{font-size:14px; color:var(--text); line-height:1.5;}

  .btn{
    font-family:var(--display); font-weight:600; font-size:14.5px;
    border-radius:10px; border:1px solid transparent; padding:13px 24px;
    display:inline-flex; align-items:center; gap:8px; transition:transform 0.15s ease, background 0.15s ease, border-color .15s ease;
    background:var(--accent); color:#1a1206;
  }
  .btn:hover{transform:translateY(-1px); background:#f0ac48;}
  .btn:active{transform:translateY(0);}
  .btn[disabled]{opacity:0.4; cursor:not-allowed; transform:none;}
  .btn-secondary{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-secondary:hover{background:var(--surface-hi); border-color:var(--text-faint);}
  .btn-ghost{background:transparent; border:none; color:var(--text-dim); padding:8px 10px;}
  .btn-ghost:hover{color:var(--accent);}
  .btn-row{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; align-items:center;}

  .card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0;}
  @media (max-width:860px){.card-grid{grid-template-columns:1fr;}}
  .choice-card{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; text-align:left; transition:border-color .15s ease, background .15s ease, transform .15s ease;
    display:flex; flex-direction:column; gap:8px; width:100%; color:var(--text);
  }
  .choice-card:hover{border-color:var(--accent); background:var(--surface-hi); transform:translateY(-2px);}
  .choice-card.selected{border-color:var(--accent); background:var(--accent-soft);}
  .choice-card .emoji{font-size:26px;}
  .choice-card .desc{font-size:13px; color:var(--text-dim); line-height:1.55;}
  .choice-card .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}

  .tag{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; padding:3px 8px; border-radius:20px; background:var(--surface-hi); color:var(--text-dim); border:1px solid var(--border);}
  .tag.good{background:var(--teal-soft); color:var(--teal); border-color:transparent;}
  .tag.warn{background:var(--red-soft); color:var(--red); border-color:transparent;}
  .tag.accent{background:var(--accent-soft); color:var(--accent); border-color:transparent;}

  .feedback-box{border-radius:var(--radius); padding:18px 20px; margin-top:18px; border:1px solid var(--border); background:var(--bg-elev); animation:fadeUp .4s ease;}
  .feedback-box.good{border-color:rgba(63,185,168,0.4);}
  .feedback-box.warn{border-color:rgba(225,88,92,0.4);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .score-line{display:flex; align-items:center; gap:10px; margin-top:12px; font-family:var(--mono); font-size:12.5px; color:var(--text-dim);}
  .score-pill{background:var(--accent-soft); color:var(--accent); padding:3px 10px; border-radius:20px; font-weight:600;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:20px 0;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim);}
  .field input, .field select, .field textarea{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:9px; padding:11px 13px;
    color:var(--text); font-family:var(--body); font-size:14px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:70px;}

  .pillar-check{display:flex; align-items:flex-start; gap:12px; cursor:pointer;}
  .pillar-check input{margin-top:3px;}

  .timeline{display:flex; flex-direction:column; gap:0; margin:24px 0;}
  .timeline-week{display:flex; gap:20px; position:relative; padding-bottom:28px;}
  .timeline-week:last-child{padding-bottom:0;}
  .timeline-dot-col{display:flex; flex-direction:column; align-items:center; flex-shrink:0;}
  .timeline-dot{width:34px; height:34px; border-radius:50%; background:var(--surface-hi); border:1px solid var(--accent); color:var(--accent); font-family:var(--mono); font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:600;}
  .timeline-line{flex:1; width:1px; background:var(--border); margin-top:4px;}
  .timeline-content{flex:1; padding-top:2px;}
  .timeline-content h4{font-family:var(--display); font-size:15.5px; margin:0 0 4px; font-weight:600;}
  .timeline-goals{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}

  .budget-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .budget-label{width:130px; font-size:13.5px; font-family:var(--mono); color:var(--text-dim); flex-shrink:0;}
  .budget-slider{flex:1;}
  .budget-slider input[type=range]{width:100%; accent-color:var(--accent);}
  .budget-val{width:46px; text-align:right; font-family:var(--mono); font-size:13px; color:var(--accent);}

  .prompt-box{background:var(--bg-elev); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:16px 18px; margin-top:22px;}
  .prompt-box .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .prompt-box .head h4{font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin:0;}
  .prompt-text{font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--text); background:var(--bg); border-radius:8px; padding:12px 14px; border:1px solid var(--border-soft); white-space:pre-wrap;}
  .copy-btn{font-family:var(--mono); font-size:11px; background:var(--surface-hi); border:1px solid var(--border); color:var(--text-dim); padding:5px 10px; border-radius:6px;}
  .copy-btn:hover{color:var(--accent); border-color:var(--accent);}
  .why-note{font-size:12.5px; color:var(--text-faint); margin-top:8px; line-height:1.6;}

  .progress-strip{display:flex; gap:5px; margin-bottom:26px;}
  .progress-seg{flex:1; height:4px; border-radius:3px; background:var(--surface-hi); overflow:hidden;}
  .progress-seg.done{background:var(--accent);}
  .progress-seg.active{background:linear-gradient(90deg,var(--accent),var(--surface-hi));}

  .grade-hero{text-align:center; padding:40px 20px;}
  .grade-letter{font-family:var(--display); font-size:96px; font-weight:700; line-height:1; background:linear-gradient(135deg,var(--accent),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px;}

  .report-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:22px 0;}
  @media (max-width:700px){.report-grid{grid-template-columns:1fr;}}
  .lesson-item{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border-soft);}
  .lesson-item:last-child{border-bottom:none;}
  .lesson-num{font-family:var(--mono); color:var(--accent); font-size:13px; flex-shrink:0; width:22px;}

  .tooltip-wrap{position:relative; display:inline-flex;}
  .tooltip-trigger{cursor:help; color:var(--text-faint); border-bottom:1px dotted var(--text-faint); font-size:12px;}
  .tooltip-pop{position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--surface-hi); border:1px solid var(--border); border-radius:8px; padding:10px 12px; width:220px; font-size:12px; color:var(--text-dim); line-height:1.5; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,0.4);}

  .welcome-hero{padding:10px 0 30px;}
  .welcome-compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:26px 0;}
  @media (max-width:700px){.welcome-compare{grid-template-columns:1fr;}}
  .compare-col{background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px;}
  .compare-col.strategy{border-color:rgba(232,163,61,0.35);}
  .compare-col h4{font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 10px; color:var(--text-dim);}
  .compare-col.strategy h4{color:var(--accent);}
  .compare-col ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--text-dim); line-height:1.8;}

  .celebration{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti-piece{position:absolute; top:-20px; width:8px; height:14px; opacity:0.9; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.3;}}

  .meter-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .meter-name{width:120px; font-size:13px; flex-shrink:0;}
  .meter-track{flex:1; height:10px; border-radius:6px; background:var(--surface-hi); overflow:hidden;}
  .meter-fill{height:100%; border-radius:6px; transition:width .7s cubic-bezier(.22,1,.36,1);}
  .meter-fit{font-family:var(--mono); font-size:11px; width:76px; text-align:right; flex-shrink:0;}

  .kicker-num{font-family:var(--mono); font-size:12px; color:var(--text-faint);}
  .divider{height:1px; background:var(--border-soft); margin:26px 0;}

  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
</style>
</head>

function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
function pick(arr, rnd){ return arr[Math.floor((rnd?rnd():Math.random()) * arr.length)]; }
function pickN(arr, n, rnd){
  const copy = [...arr];
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = Math.floor((rnd?rnd():Math.random()) * copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}

function generateClient(seed){
  const rnd = seededRandom(seed);
  const industry = pick(INDUSTRIES, rnd);
  const audienceText = pick(AUDIENCES_TEXT, rnd);
  const competitors = pickN(['Northlane','Verve & Co','Basecamp Studio','Bright Fox','Lumen Group','Kindred Supply','Anchor & Ash','Fieldnote','Otter Digital','Maple Union'], 3, rnd);
  return {
    id:'client-'+seed,
    industry,
    audienceText,
    budget: pick(BUDGETS, rnd),
    competitors,
    challenge: pick(CHALLENGES, rnd),
    goal: pick(GOALS, rnd),
    name: industry + ' venture'
  };
}

function clamp(n, min=0, max=100){ return Math.max(min, Math.min(max, n)); }
function gradeFromScore(avg){
  if(avg>=93) return 'A+';
  if(avg>=87) return 'A';
  if(avg>=80) return 'A-';
  if(avg>=74) return 'B+';
  if(avg>=68) return 'B';
  if(avg>=62) return 'B-';
  if(avg>=55) return 'C+';
  if(avg>=48) return 'C';
  if(avg>=38) return 'D';
  return 'F';
}

function Tooltip({label, text}){
  const [open,setOpen] = useState(false);
  return (
    <span className="tooltip-wrap">
      <span className="tooltip-trigger" tabIndex="0"
        onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)}
        onFocus={()=>setOpen(true)} onBlur={()=>setOpen(false)}>{label}</span>
      {open && <span className="tooltip-pop" role="tooltip">{text}</span>}
    </span>
  );
}

function PromptBox({title, prompt, why}){

    <div className="prompt-box">

  );
}

    left: Math.random()*100,
    delay: Math.random()*0.6,

function App(){
  const [stageIdx, setStageIdx] = useState(0);

  const [showCelebration, setShowCelebration] = useState(false);
  const [clientSeed, setClientSeed] = useState(1);

  function bumpScore(key, val){
    setScores(s => ({...s, [key]: clamp(val)}));
  }
  function addGrowth(delta){
    setScores(s => ({...s, growth: clamp(s.growth + delta)}));
  }

  function goTo(name){
    setStageIdx(STAGES.indexOf(name));
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function next(){ setStageIdx(i=>Math.min(i+1, STAGES.length-1)); window.scrollTo({top:0, behavior:'smooth'}); }
  function back(){ setStageIdx(i=>Math.max(i-1,0)); window.scrollTo({top:0, behavior:'smooth'}); }

  function restart(){
    setStageIdx(0); setMode(null); setProfile(null);
    setScores({audience:0, positioning:0, platform:0, content:0, growth:50});
    setChosenAudience(null); setChosenPositioning(null); setChosenPlatforms([]);
    setChosenPillars([]); setBudget({content:30, ads:25, community:20, partnerships:15, email:10});
    setEvent(null); setEventChoice(null); setShowCelebration(false);
  }

  const isPersonal = mode === 'personal';
  const pillarSet = isPersonal ? CONTENT_PILLARS_PERSONAL : CONTENT_PILLARS_BUSINESS;

  useEffect(()=>{
    if(STAGES[stageIdx] === 'Final Report'){
      setShowCelebration(true);
      const t = setTimeout(()=>setShowCelebration(false), 3200);
      return ()=>clearTimeout(t);
    }
  }, [stageIdx]);

  useEffect(()=>{
    if(STAGES[stageIdx] === 'Market Event' && !event){
      const pool = isPersonal ? EVENTS_PERSONAL : EVENTS_BUSINESS;
      setEvent(pick(pool));
    }
  }, [stageIdx]);

  const stageName = STAGES[stageIdx];

  return (
    <div className="app-shell">
      {showCelebration && <Confetti />}

        </div>
        <div className="gauge-list">
          <Gauge label="Audience" value={scores.audience} />
          <Gauge label="Positioning" value={scores.positioning} />
          <Gauge label="Platform" value={scores.platform} />
          <Gauge label="Content" value={scores.content} />
          <Gauge label="Growth" value={scores.growth} />
        </div>

          {stageName==='Positioning' && (
            <PositioningStep
              chosenAudience={chosenAudience}
              chosen={chosenPositioning}

                setChosenPositioning(pos);

            <PillarStep

                setChosenPillars(prev=>{
                  const exists = prev.find(x=>x.id===p.id);

                  if(exists){ next = prev.filter(x=>x.id!==p.id); }

                  return next;

              onRestart={restart}
            />
          )}
        </div>
      </main>
    </div>
  );

function normalizeClient(c){
  return {
    kind:'random',
    name: c.name,
    industry: c.industry,
    audienceText: c.audienceText,
    budget: c.budget,
    competitors: c.competitors,
    challenge: c.challenge,
    goal: c.goal,
  };
}

function computeAudienceScore(seg, profile, isPersonal){
  let score = 58; // baseline for any deliberate, reasoned choice
  const text = ((profile && (profile.audienceText || profile.goals || '')) || '').toLowerCase();
  const kw = {
    beginners:['beginner','new','starter','learn'],
    professionals:['professional','expert','business','industry','remote','team'],
    students:['student','college','career','young'],
    'business-owners':['owner','business','entrepreneur','founder'],
    hobbyists:['hobby','passion','creative','enjoy','family'],
  };
  const hits = (kw[seg.id]||[]).filter(k=>text.includes(k)).length;
  score += hits * 14;
  return clamp(score);
}

function computePlatformScore(selected, chosenAudience, isPersonal){
  if(!selected.length) return 0;
  const audId = chosenAudience ? chosenAudience.id : 'professionals';
  let total = 0;
  selected.forEach(p=>{
    let fit = PLATFORM_FIT_BASE[p.id][audId] || 50;
    if(isPersonal){ fit = fit * (PERSONAL_PLATFORM_BOOST[p.id]||1); }
    total += fit;
  });
  let avg = total/selected.length;
  if(selected.length > 4) avg -= (selected.length-4)*6; // overextension penalty
  return clamp(avg);
}

function fitLabel(score){
  if(score>=75) return {t:'Strong fit', cls:'good'};
  if(score>=55) return {t:'Moderate fit', cls:'accent'};
  return {t:'Poor fit', cls:'warn'};
}

/* ---------- Stage: Budget ---------- */
function BudgetStep({budget, setBudget, chosenPlatforms, onApply, onNext, onBack}){
  const total = Object.values(budget).reduce((a,b)=>a+b,0);
  const [applied, setApplied] = useState(false);

  function updateChannel(key, val){
    setBudget(b=>({...b, [key]: Number(val)}));
    setApplied(false);
  }

  function analysis(){
    const notes = [];
    if(budget.content >= 50) notes.push({t:'Content is over half the budget — strong for organic growth, but leaves little room to amplify winners.', tag:'accent'});
    if(budget.ads >= 50) notes.push({t:'Heavy ad weighting can buy short-term reach fast, but rarely builds lasting trust on its own.', tag:'warn'});
    if(budget.community <= 5) notes.push({t:'Very low community investment risks a brand that broadcasts but never listens.', tag:'warn'});
    if(budget.partnerships >= 30) notes.push({t:'Leaning heavily on partnerships borrows someone else\u2019s audience — powerful, but dependent.', tag:'accent'});
    if(budget.email <= 5 && chosenPlatforms.some(p=>p.id==='newsletter')) notes.push({t:'You picked Newsletter as a platform but under-funded email — the channel needs the spend to matter.', tag:'warn'});
    if(notes.length===0) notes.push({t:'A balanced spread across channels — lower risk, but also slower to produce a standout result anywhere.', tag:'accent'});
    return notes;
  }

  function apply(){
    const notes = analysis();
    const delta = notes.filter(n=>n.tag==='warn').length * -3 + (notes.every(n=>n.tag!=='warn') ? 5 : 0);
    onApply(delta);
    setApplied(true);
  }

  const channels = [
    {key:'content', label:'Content'},
    {key:'ads', label:'Ads'},
    {key:'community', label:'Community'},
    {key:'partnerships', label:'Partnerships'},
    {key:'email', label:'Email'},
  ];

  return (
    <div>
      <div className="eyebrow">Step 8 · Marketing Budget Simulator</div>
      <h1 className="page-title">Where should the budget go?</h1>
      <p className="lede">Budget allocation is a strategy decision, not an accounting one — every point you give one channel is a point you're not giving another. Distribute 100 points across five channels.</p>

      <div className="panel">
        {channels.map(c=>(
          <div className="budget-row" key={c.key}>
            <div className="budget-label">{c.label}</div>
            <div className="budget-slider">
              <input type="range" min="0" max="100" value={budget[c.key]} onChange={e=>updateChannel(c.key, e.target.value)} aria-label={c.label+' budget percent'} />
            </div>
            <div className="budget-val">{budget[c.key]}%</div>
          </div>
        ))}
        <div className="score-line">Total Allocated <span className="score-pill" style={{background: total===100?'var(--teal-soft)':'var(--red-soft)', color: total===100?'var(--teal)':'var(--red)'}}>{total}%</span></div>
        <div className="btn-row" style={{marginTop:16}}>
          <button className="btn" disabled={total!==100} onClick={apply}>Run Allocation →</button>
        </div>
      </div>

      {applied && (
        <div className="feedback-box">
          <h3 className="card-title">Tradeoff analysis</h3>
          {analysis().map((n,i)=>(
            <p key={i} className="body-text" style={{marginBottom:8}}>
              <span className={"tag " + n.tag} style={{marginRight:8}}>{n.tag==='warn'?'Risk':'Note'}</span>{n.t}
            </p>
          ))}
        </div>
      )}

      <PromptBox
        prompt="Act as a marketing budget strategist. Given this channel mix, tell me which allocation is underfunded relative to my goals, and what I'm implicitly trading off by funding it that way."
        why="Framing budget as a tradeoff question — not 'is this good' — surfaces the opportunity cost of every allocation, which is the actual decision being made."
      />

      <div className="btn-row">
        <button className="btn-secondary btn" onClick={onBack}>← Back</button>
        <button className="btn" disabled={!applied} onClick={onNext}>Continue →</button>
      </div>
    </div>
  );
}

      {choice && (
        <div className={"feedback-box " + (choice.tag)}>
          <h3 className="card-title">Consequence</h3>
          <p className="body-text">{choice.d}</p>
          <div className="score-line">Growth Score change <span className="score-pill" style={{background: choice.growth>=0 ? 'var(--teal-soft)':'var(--red-soft)', color: choice.growth>=0?'var(--teal)':'var(--red)'}}>{choice.growth>=0?'+':''}{choice.growth}</span></div>
        </div>
      )}

      <PromptBox
        prompt="Act as a crisis-aware marketing strategist. Given this unexpected situation, walk through two or three response options and the second-order consequences of each before recommending one."
        why="Asking for second-order consequences — not just 'what should I do' — is what separates a reactive answer from a strategic one."
      />

      <div className="btn-row">
        <button className="btn-secondary btn" onClick={onBack}>← Back</button>
        <button className="btn" disabled={!choice} onClick={onNext}>Continue →</button>
      </div>
    </div>
  );
}

/* ---------- Stage: Scoreboard ---------- */
function ScoreboardStep({scores, onNext, onBack}){
  const entries = [
    {k:'audience', l:'Audience Score'},
    {k:'positioning', l:'Positioning Score'},
    {k:'platform', l:'Platform Score'},
    {k:'content', l:'Content Score'},
    {k:'growth', l:'Growth Score'},
  ];
  return (
    <div>
      <div className="eyebrow">Step 10 · Strategic Decision Scoreboard</div>
      <h1 className="page-title">Here's how your decisions add up.</h1>
      <p className="lede">Every choice you made fed one of these five scores. Nothing here is generated content — it's a record of strategic decisions and their consequences.</p>

      <div className="panel">
        {entries.map(e=>(
          <div key={e.k} style={{marginBottom:18}}>
            <div className="score-line" style={{marginTop:0, justifyContent:'space-between'}}>
              <span style={{fontFamily:'var(--display)', fontSize:14, color:'var(--text)'}}>{e.l}</span>
              <span className="score-pill">{Math.round(scores[e.k])}/100</span>
            </div>
            <div className="gauge-track" style={{height:9}}>
              <div className="gauge-fill" style={{width: scores[e.k]+'%', transition:'width 1s cubic-bezier(.22,1,.36,1)'}}></div>
            </div>
          </div>
        ))}
      </div>

      <div className="btn-row">
        <button className="btn-secondary btn" onClick={onBack}>← Back</button>
        <button className="btn" onClick={onNext}>See Final Report →</button>
      </div>
    </div>
  );
}

/* ---------- Stage: Final Report ---------- */
function FinalReport({scores, mode, isPersonal, chosenAudience, chosenPositioning, chosenPlatforms, chosenPillars, eventChoice, profile, onRestart}){
  const avg = (scores.audience + scores.positioning + scores.platform + scores.content + scores.growth) / 5;
  const grade = gradeFromScore(avg);

  const strengths = [
    {k:'audience', l:'audience targeting'}, {k:'positioning', l:'positioning'},
    {k:'platform', l:'platform selection'}, {k:'content', l:'content strategy'}, {k:'growth', l:'crisis response & growth'}
  ].sort((a,b)=>scores[b.k]-scores[a.k]);
  const best = strengths[0];
  const worst = strengths[strengths.length-1];

  const lessons = isPersonal ? [
    'Authenticity compounds — a real story consistently told outperforms a polished one told once.',
    'Consistency beats intensity. A steady weekly rhythm builds more trust than one viral spike.',
    'Niche clarity is a gift to your audience, not a limitation on you — it tells people exactly why to follow.',
  ] : [
    'Positioning is a promise every channel has to keep — mismatched platforms undercut even strong positioning.',
    'Budget allocation is a strategy decision, not a formality — every channel funded is a channel chosen over another.',
    'Crisis response reveals strategy faster than any campaign — how a brand reacts under pressure is remembered longer than what it posts on a normal day.',
  ];

  return (
    <div>
      <div className="eyebrow">Final Growth Report</div>
      <h1 className="page-title">The report is in.</h1>

      <div className="panel grade-hero">
        <div className="kicker-num">Overall Marketing Grade</div>
        <div className="grade-letter">{grade}</div>
        <p className="body-text" style={{maxWidth:480, margin:'0 auto'}}>Composite score: {Math.round(avg)}/100 across audience, positioning, platform, content, and growth decisions.</p>
      </div>

      <div className="report-grid">
        <div className="panel panel-tight">
          <h3 className="card-title">Audience Understanding</h3>
          <p className="body-text">Targeted <strong>{chosenAudience ? chosenAudience.label : 'no segment'}</strong> — score {Math.round(scores.audience)}/100.</p>
        </div>
        <div className="panel panel-tight">
          <h3 className="card-title">Positioning</h3>
          <p className="body-text">Positioned as <strong>{chosenPositioning ? chosenPositioning.label : '—'}</strong> — score {Math.round(scores.positioning)}/100.</p>
        </div>
        <div className="panel panel-tight">
          <h3 className="card-title">Platform Strategy</h3>
          <p className="body-text">Focused on <strong>{chosenPlatforms.map(p=>p.label).join(', ') || '—'}</strong> — score {Math.round(scores.platform)}/100.</p>
        </div>
        <div className="panel panel-tight">
          <h3 className="card-title">Content Strategy</h3>
          <p className="body-text">Built around <strong>{chosenPillars.map(p=>p.label).join(', ') || '—'}</strong> — score {Math.round(scores.content)}/100.</p>
        </div>
      </div>

      <div className="panel">
        <h3 className="card-title">Growth Potential</h3>
        <p className="body-text">The growth score of <strong>{Math.round(scores.growth)}/100</strong> reflects budget discipline and how the unexpected market event was handled — the moments that separate a brand that adapts from one that just reacts.</p>
      </div>

      <div className="report-grid">
        <div className="panel panel-tight" style={{borderColor:'rgba(63,185,168,0.4)'}}>
          <h3 className="card-title">Best decision</h3>
          <p className="body-text">Your strongest area was <strong>{best.l}</strong> at {Math.round(scores[best.k])}/100 — this is the foundation the rest of the strategy can build on.</p>
        </div>
        <div className="panel panel-tight" style={{borderColor:'rgba(225,88,92,0.4)'}}>
          <h3 className="card-title">Biggest mistake</h3>
          <p className="body-text"><strong>{worst.l}</strong> lagged at {Math.round(scores[worst.k])}/100 — revisit this decision first before scaling anything else.</p>
        </div>
      </div>

      <div className="panel">
        <h3 className="card-title">Strategic recommendations</h3>
        <p className="body-text">Double down on {best.l} while it's working, but don't scale spend or content volume until {worst.l} is addressed — a weak link there will cap the return on everything else. {isPersonal ? 'Keep showing up with the same core story; audiences reward recognizability over novelty.' : 'Revisit this positioning and platform pairing quarterly as the market and competitors shift.'}</p>
      </div>

      <div className="panel">
        <h3 className="card-title">Three marketing lessons</h3>
        {lessons.map((l,i)=>(
          <div className="lesson-item" key={i}>
            <div className="lesson-num">0{i+1}</div>
            <div className="body-text">{l}</div>
          </div>
        ))}
      </div>

      <PromptBox
        prompt={isPersonal
          ? "Act as a personal brand strategist. Review my positioning, platform choices, and content pillars, then tell me the single highest-leverage change to make next."
          : "Act as a marketing strategist. Review my positioning, platform choices, and content pillars, then tell me the single highest-leverage change to make next."}
        why="Asking for one highest-leverage change — not a full list — mirrors how strategists prioritize under real constraints instead of trying to fix everything at once."
      />

      <div className="btn-row">
        <button className="btn" onClick={onRestart}>↻ Replay Simulation</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

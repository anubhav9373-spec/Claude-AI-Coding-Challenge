<!DOCTYPE html>
<html lang="en">
<head>
<!-- skill:chrome -->
<style>
/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    function init() {
        markEditable();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>
<!-- /skill:chrome -->
<!-- skill:libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js" integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y" crossorigin="anonymous"></script>
<!-- /skill:libraries -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.99 0.008 100);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.97 0.012 100);
  --ink: oklch(0.34 0.03 260);
  --ink-soft: oklch(0.54 0.03 260);
  --line: oklch(0.9 0.015 260);
  --green: oklch(0.72 0.17 140);
  --green-deep: oklch(0.62 0.18 142);
  --blue: oklch(0.82 0.09 250);
  --orange: oklch(0.8 0.13 62);
  --pink: oklch(0.84 0.1 8);
  --lime: oklch(0.85 0.16 132);
  --good: oklch(0.62 0.16 145);
  --bad: oklch(0.58 0.2 22);
  --shadow-sm: 0 2px 8px oklch(0.5 0.05 260 / .12);
  --shadow-md: 0 12px 30px oklch(0.5 0.05 260 / .16);
  --e-out: cubic-bezier(0.22,1,0.36,1);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
  --font-display:'Fredoka',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif;
  background:
    radial-gradient(1100px 460px at 82% -8%, oklch(0.93 0.06 130 / .45), transparent 60%),
    radial-gradient(900px 460px at 6% 0%, oklch(0.92 0.05 250 / .4), transparent 55%),
    var(--bg);
  color:var(--ink);min-height:100%;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;line-height:1.05}
button{font-family:inherit;cursor:pointer;border:none}
.tnum{font-variant-numeric:tabular-nums}

.ch{display:block;height:auto;mix-blend-mode:multiply;pointer-events:none;-webkit-user-select:none;user-select:none}
.anim-bounce{animation:bounce 1.8s var(--e-out) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.anim-dance{animation:dance 1.3s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.anim-float{animation:floaty 3.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.anim-jump{animation:jump 1.5s var(--e-out) infinite}
@keyframes jump{0%,100%{transform:translateY(0)}20%{transform:translateY(0)}55%{transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:var(--sp-4);
  padding:var(--sp-3) clamp(16px,4vw,40px);background:oklch(1 0 0 / .84);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--green-deep)}
.nav .brand .ch{width:48px}
.nav .spacer{flex:1}
.nav button.link{background:transparent;color:var(--ink-soft);font-weight:700;font-size:.95rem;padding:8px 15px;border-radius:999px;transition:background .18s var(--e-out),color .18s var(--e-out);font-family:var(--font-display)}
.nav button.link:hover{background:var(--surface-2);color:var(--ink)}
.nav button.link.active{background:var(--green);color:oklch(0.28 0.06 142)}

.screen{display:none;animation:fade .4s var(--e-out)}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(16px,4vw,40px) 80px}
.wrap.wide{max-width:1320px;padding-bottom:32px}

/* HOME title band */
.title-band{position:relative;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 0 4px;text-align:center}
.title-band h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.8rem,8vw,4.6rem);color:var(--green-deep);letter-spacing:.5px;position:relative;z-index:2}
.title-band .sub{color:var(--ink-soft);font-weight:700;margin-top:8px;font-size:1.08rem;position:relative;z-index:2}
.title-band .ch{position:absolute;z-index:1;top:2px;width:138px}
.tb1{left:1%}.tb2{left:18%}.tb3{left:35.5%}.tb4{left:53%}.tb5{left:70.5%}.tb6{left:88%}
@media(max-width:1040px){.tb3,.tb4{display:none}}
@media(max-width:820px){.tb2,.tb5{display:none}}
@media(max-width:520px){.tb1,.tb6{display:none}.title-band{min-height:auto;padding-top:8px}}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-top:var(--sp-6)}
@media(max-width:820px){.modes{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.modes{grid-template-columns:1fr}}
.mode-cell{display:flex;flex-direction:column;align-items:center}
.mode{width:100%;position:relative;border-radius:22px;padding:22px 20px;text-align:center;color:oklch(0.26 0.04 260);
  box-shadow:var(--shadow-sm);transition:transform .22s var(--e-out),box-shadow .22s var(--e-out)}
.mode:hover{transform:translateY(-6px);box-shadow:var(--shadow-md)}
.mode:active{transform:translateY(-2px)}
.mode .big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1}
.mode .small{font-weight:700;opacity:.9;margin-top:4px;font-size:.92rem;font-family:var(--font-display)}
.mode.blue{background:linear-gradient(180deg,var(--blue),oklch(0.76 0.1 250))}
.mode.orange{background:linear-gradient(180deg,var(--orange),oklch(0.74 0.14 55))}
.mode.pink{background:linear-gradient(180deg,var(--pink),oklch(0.78 0.11 5))}
.mode.lime{background:linear-gradient(180deg,var(--lime),oklch(0.78 0.17 132))}
.mode-cell .ch{width:150px;margin-top:14px}

.home-actions{display:flex;justify-content:center;gap:var(--sp-3);margin-top:var(--sp-8);flex-wrap:wrap}
.btn{border-radius:999px;padding:12px 24px;font-weight:700;font-size:1rem;font-family:var(--font-display);transition:transform .18s var(--e-out),box-shadow .18s var(--e-out);box-shadow:var(--shadow-sm)}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--green);color:oklch(0.26 0.05 142)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:oklch(0.88 0.13 92);color:oklch(0.34 0.06 60)}
.btn.sm{padding:8px 16px;font-size:.9rem}

/* section head: title + pill on the left, buddies spread across the rest of the band */
.section-head{display:flex;align-items:center;gap:14px;margin-bottom:var(--sp-6);flex-wrap:wrap}
.section-head h2{font-size:clamp(1.7rem,4vw,2.4rem);color:var(--green-deep)}
.head-buddies{flex:1;min-width:260px;display:flex;align-items:flex-end;justify-content:space-evenly;gap:12px}
.head-buddies .ch{width:92px}
@media(max-width:760px){.head-buddies .ch:nth-child(n+3){display:none}}
@media(max-width:520px){.head-buddies{display:none}}
.pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--ink-soft);font-size:.85rem;font-family:var(--font-display)}

/* ============ TYPING ============ */
.type-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:6px}
.type-top .mode-tag{font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--green-deep)}
.type-top .mode-tag small{display:block;font-size:.85rem;color:var(--ink-soft);font-weight:600}
.top-center{display:flex;align-items:center;gap:16px}
.top-center .ch{width:66px}
@media(max-width:820px){.top-center .ch{display:none}}
.timer{font-family:var(--font-display);font-weight:700;font-size:1.8rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 18px;box-shadow:var(--shadow-sm)}
.metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--sp-2);margin-bottom:6px}
@media(max-width:820px){.metrics{grid-template-columns:repeat(4,1fr)}}
@media(max-width:460px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.metric .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800;white-space:nowrap}
.metric .v{font-family:var(--font-display);font-weight:700;font-size:1.25rem;margin-top:1px}

.stage-row{display:grid;grid-template-columns:140px 1fr 140px;gap:var(--sp-4);align-items:center;margin-bottom:6px}
@media(max-width:900px){.stage-row{grid-template-columns:1fr}.stage-row .side-buddy{display:none}}
.side-buddy{display:flex;flex-direction:column;align-items:center;gap:10px}
.side-buddy .ch{width:132px}
.teleprompter{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px clamp(32px,8vw,64px);box-shadow:var(--shadow-sm);
  font-family:var(--font-display);font-weight:500;font-size:1.8rem;line-height:2.4;letter-spacing:.01em;cursor:text;overflow:hidden}
.tline{white-space:pre-wrap;color:oklch(0.72 0.02 260);min-height:2.8em}
.tline.cur{color:var(--ink)}
.tline .c.ok{color:var(--good)}
.tline .c.err{color:var(--bad);background:oklch(0.9 0.08 22);border-radius:3px}
.tline .c.cursor{border-bottom:3px solid var(--green-deep);border-radius:2px}
.tline .c.err.space{background:oklch(0.82 0.12 22)}
#hiddenInput{position:absolute;opacity:0;left:-9999px;width:1px;height:1px}

.kb-zone{display:grid;grid-template-columns:120px 1fr 120px;gap:var(--sp-3);align-items:center}
@media(max-width:900px){.kb-zone{grid-template-columns:1fr}.kb-zone .kb-buddy{display:none}}
.kb-buddy{display:flex;justify-content:center}
.kb-buddy .ch{width:120px}
.keyboard{background:linear-gradient(180deg,oklch(0.96 0.006 260),oklch(0.92 0.008 260));border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow-md);user-select:none}
.krow{display:flex;gap:5px;justify-content:center;margin-bottom:5px}
.krow:last-child{margin-bottom:0}
.key{height:38px;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;font-weight:700;font-size:.8rem;color:var(--ink-soft);transition:transform .07s var(--e-out),background .07s,color .07s,border-color .07s}
.key.k15{flex:1.5}.key.k175{flex:1.75}.key.k2{flex:2}.key.k225{flex:2.25}.key.k25{flex:2.5}
.key.space{flex:7}
.key.accent{background:var(--surface-2);color:var(--ink-soft);font-size:.7rem}
.key.down{transform:translateY(2px);border-bottom-width:1px}
.key.ok{background:var(--good);color:#fff;border-color:var(--good)}
.key.err{background:var(--bad);color:#fff;border-color:var(--bad)}
@media(max-width:640px){.key{height:32px;font-size:.7rem}}
@media(max-width:480px){.keyboard{display:none}}
.live-ctrl{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);flex-wrap:wrap;justify-content:center}

/* results */
.celebrate{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,3vw,40px);margin-bottom:var(--sp-6);flex-wrap:wrap}
.celebrate .ch{width:150px}
.grade-card{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow-md);margin-bottom:var(--sp-6)}
.grade-card .grade{font-family:var(--font-display);font-size:4rem;font-weight:700;color:var(--green-deep);line-height:1}
.grade-card .glabel{color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-6)}
.rstat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.rstat .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800}
.rstat .v{font-family:var(--font-display);font-size:1.8rem;font-weight:700;margin-top:4px}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm);margin-bottom:var(--sp-6)}
.chart-box h3{margin-bottom:14px;font-size:1.25rem}
.chart-holder{position:relative;height:300px}

/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-8)}
.dstat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.dstat .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800}
.dstat .v{font-family:var(--font-display);font-size:2rem;font-weight:700;margin-top:4px}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.table th,.table td{padding:12px 14px;text-align:left;font-size:.9rem;border-bottom:1px solid var(--line)}
.table th{background:var(--surface-2);font-weight:800;color:var(--ink-soft);text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
.table tr:last-child td{border-bottom:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-soft);font-weight:700;padding:32px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.empty .ch{width:140px}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-4)}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;gap:14px;align-items:center;transition:transform .2s var(--e-out)}
.ach.locked{opacity:.5;filter:grayscale(.6)}
.ach.unlocked:hover{transform:translateY(-4px)}
.ach .badge{width:52px;height:52px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--surface-2)}
.ach.unlocked .badge{background:linear-gradient(180deg,oklch(0.88 0.13 92),oklch(0.8 0.14 82))}
.ach h4{font-family:var(--font-display);font-size:1.05rem}
.ach p{color:var(--ink-soft);font-weight:600;font-size:.82rem;margin-top:2px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow-md);display:flex;gap:10px;align-items:center;font-weight:800;animation:slidein .4s var(--e-out)}
.toast .t-ico{font-size:1.4rem}
@keyframes slidein{from{transform:translateX(120%)}to{transform:none}}
.subhead{font-family:var(--font-display);font-size:1.35rem;margin:var(--sp-8) 0 var(--sp-4)}
.wm-cover{position:fixed;right:0;bottom:0;width:190px;height:38px;background:var(--bg);z-index:2147483647;pointer-events:none}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><img class="ch" id="navCh" alt=""> Typing Studio</div>
  <div class="spacer"></div>
  <button class="link active" data-go="home">Home</button>
  <button class="link" data-go="dashboard">Dashboard</button>
  <button class="link" data-go="achievements">Achievements</button>
</nav>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="wrap">
    <div class="title-band">
      <img class="ch tb1 anim-float" data-pose="crown" alt="">
      <img class="ch tb2 anim-dance" data-pose="cheeky" alt="">
      <img class="ch tb3 anim-bounce" data-pose="thumbs" alt="">
      <img class="ch tb4 anim-float" data-pose="point" alt="">
      <img class="ch tb5 anim-bounce" data-pose="gaming" alt="">
      <img class="ch tb6 anim-float" data-pose="banana" alt="">
      <h1>Typing Studio</h1>
      <p class="sub">Type fun little stories, race the clock, and level up your speed.</p>
    </div>
    <div class="modes" id="modeGrid"></div>
    <div class="home-actions">
      <button class="btn ghost" data-go="dashboard">📊 My Dashboard</button>
      <button class="btn warm" data-go="achievements">🏆 Achievements</button>
      <button class="btn primary" id="downloadBtn">⬇️ Download this app</button>
    </div>
  </div>
</section>

<!-- TYPING -->
<section class="screen" id="typing">
  <div class="wrap wide">
    <div class="type-top">
      <div class="mode-tag" id="typeModeTag">1 Minute<small id="typeCatTag">Adventure</small></div>
      <div class="top-center">
        <img class="ch anim-float" data-pose="cheeky" alt="">
        <img class="ch anim-bounce" data-pose="thumbs" alt="">
        <div class="timer tnum" id="timer">01:00</div>
        <img class="ch anim-bounce" data-pose="point" alt="">
        <img class="ch anim-float" data-pose="crown" alt="">
      </div>
      <button class="btn ghost sm" id="quitBtn">Quit</button>
    </div>
    <div class="metrics" id="metricRow"></div>
    <div class="stage-row">
      <span class="side-buddy"><img class="ch anim-float" data-pose="reading" alt=""></span>
      <div class="teleprompter" id="prompter" tabindex="0">
        <div class="tline cur" id="l0"></div>
        <div class="tline" id="l1"></div>
        <div class="tline" id="l2"></div>
        <div class="tline" id="l3"></div>
      </div>
      <span class="side-buddy"><img class="ch anim-bounce" data-pose="banana" alt=""></span>
    </div>
    <input id="hiddenInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="kb-zone">
      <span class="kb-buddy"><img class="ch anim-bounce" data-pose="thumbs" alt=""></span>
      <div class="keyboard" id="keyboard"></div>
      <span class="kb-buddy"><img class="ch anim-float" data-pose="point" alt=""></span>
    </div>
    <div class="live-ctrl" id="liveCtrl" style="display:none">
      <button class="btn warm" id="pauseBtn">⏸ Pause</button>
      <button class="btn primary" id="endBtn">🏁 End Session</button>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section class="screen" id="results">
  <div class="wrap">
    <div class="celebrate">
      <img class="ch anim-dance" data-pose="cheeky" alt="">
      <img class="ch anim-jump" data-pose="trophy" alt="">
      <img class="ch anim-bounce" data-pose="banana" alt="">
    </div>
    <div class="grade-card">
      <div class="grade" id="rGrade">A</div>
      <div class="glabel">Typing Grade</div>
    </div>
    <div class="rstats" id="rStats"></div>
    <div class="chart-box">
      <h3>Session comparison</h3>
      <div class="chart-holder"><canvas id="perfChart"></canvas></div>
    </div>
    <div class="home-actions" style="margin-top:0">
      <button class="btn ghost" data-go="home">🏠 Home</button>
      <button class="btn primary" id="retryBtn">🔁 Type again</button>
    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section class="screen" id="dashboard">
  <div class="wrap">
    <div class="section-head">
      <h2>Dashboard</h2><span class="pill" id="dashCount">0 sessions</span>
      <div class="head-buddies">
        <img class="ch anim-float" data-pose="reading" alt="">
        <img class="ch anim-bounce" data-pose="stopwatch" alt="">
        <img class="ch anim-float" data-pose="thumbs" alt="">
        <img class="ch anim-bounce" data-pose="point" alt="">
      </div>
    </div>
    <div class="dash-grid" id="dashGrid"></div>
    <h3 class="subhead">History</h3>
    <div id="historyHolder"></div>
    <div class="chart-box" style="margin-top:32px" id="dashChartBox">
      <h3>Progress over time</h3>
      <div class="chart-holder"><canvas id="dashChart"></canvas></div>
    </div>
  </div>
</section>

<!-- ACHIEVEMENTS -->
<section class="screen" id="achievements">
  <div class="wrap">
    <div class="section-head">

/* ============ TEXT ============ */
function buildParagraph(){
  let parts=[];
  const lead=CATS[Math.floor(Math.random()*CATS.length)];
  for(let i=0;i<40;i++){
    const cat = i===0 ? lead : CATS[Math.floor(Math.random()*CATS.length)];
    const lines=STORIES[cat].slice();
    for(let j=lines.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[lines[j],lines[r]]=[lines[r],lines[j]];}
    parts.push(lines.join(' '));
  }
  return {cat:lead,text:parts.join(' ').replace(/\s+/g,' ').trim()};
}
function wrapText(text,maxChars){
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){
    if(cur && (cur.length+1+w.length)>maxChars){lines.push(cur);cur=w;}
    else cur=cur?cur+' '+w:w;
  }
  if(cur)lines.push(cur);
  return lines;
}

const KB_LAYOUT=[

  [['tab','tab','k15 accent'],['q',''],['w',''],['e',''],['r',''],['t',''],['y',''],['u',''],['i',''],['o',''],['p',''],['[',''],[']',''],['\\','\\','accent']],

  [['ctrl','ctrl','accent'],['fn','fn','accent'],['alt','alt','accent'],['cmd','⌘','accent'],[' ','','space'],['cmd','⌘','accent'],['alt','alt','accent'],['◂','◂','accent'],['▸','▸','accent']]

/* ============ ENGINE ============ */
const WRAP=64;
function startSession(mode){
  const p=buildParagraph();
  document.getElementById('typeModeTag').firstChild.textContent=MODES[mode].label;
  document.getElementById('typeCatTag').textContent=p.cat+' story';
  document.getElementById('liveCtrl').style.display=mode==='live'?'flex':'none';
  buildMetricRow();
  engine=new Engine(mode,p);
  go('typing');engine.focus();
}
function buildMetricRow(){
  const keys=[['wpm','WPM'],['acc','Acc'],['chars','Chars'],['words','Words'],['wrong','Wrong'],['mistakes','Mistakes'],['streak','Streak'],['best','Best']];
  const row=document.getElementById('metricRow');row.innerHTML='';
  keys.forEach(([id,label])=>{const d=document.createElement('div');d.className='metric';d.innerHTML='<div class="k">'+label+'</div><div class="v tnum" id="m_'+id+'">0</div>';row.appendChild(d);});
}
class Engine{
  constructor(mode,para){
    this.mode=mode;this.cat=para.cat;
    this.lines=wrapText(para.text,WRAP);
    this.pageStart=0;this.lineInPage=0;
    this.results={};
    this.correct=0;this.incorrect=0;this.total=0;this.words=0;this.wrongWords=0;this.mistakes=0;
    this.streak=0;this.bestStreak=0;this.started=false;this.finished=false;this.paused=false;
    this.elapsed=0;this.lastTick=null;this.remaining=MODES[mode].secs;this.samples=[];this.lastSample=0;
    this.bindKeys();this.renderLines();this.updateTimer();this.updateMetrics();
    this.tickHandle=setInterval(()=>this.tick(),200);
    this._prevent=(e)=>{e.preventDefault();this.focus();};
    document.getElementById('prompter').addEventListener('mousedown',this._prevent);
    document.getElementById('pauseBtn').onclick=()=>this.togglePause();
    document.getElementById('endBtn').onclick=()=>this.finish();
    document.getElementById('quitBtn').onclick=()=>{this.teardown();go('home');};
    document.getElementById('retryBtn').onclick=()=>startSession(this.mode);
  }
  curIdx(){return this.pageStart+this.lineInPage;}
  focus(){document.getElementById('hiddenInput').focus({preventScroll:true});}
  bindKeys(){
    this._key=(e)=>{
      if(this.finished)return;
      if(!document.getElementById('typing').classList.contains('on'))return;
      if(e.ctrlKey||e.metaKey||e.altKey)return;
      const k=e.key;
      if(k==='Shift'){flashKey('shift',true);return;}
      if(k==='Backspace'){e.preventDefault();this.backspace();return;}
      if(k==='Enter'){e.preventDefault();flashKey('enter',true);return;}
      if(k==='Tab')return;
      if(k.length===1){e.preventDefault();if(this.paused)return;this.type(k);}
    };
    document.addEventListener('keydown',this._key);
  }
  ensureStarted(){if(!this.started){this.started=true;this.lastTick=performance.now();}}
  type(ch){
    this.ensureStarted();
    const idx=this.curIdx();const line=this.lines[idx];if(!line)return;
    const arr=this.results[idx]||(this.results[idx]=[]);
    const expected=line[arr.length];const ok=ch===expected;
    flashKey(ch===' '?' ':ch.toLowerCase(),ok);
    arr.push(ok);this.total++;
    if(ok){this.correct++;this.streak++;if(this.streak>this.bestStreak)this.bestStreak=this.streak;}
    else{this.incorrect++;this.mistakes++;this.streak=0;}
    if(arr.length>=line.length)this.completeLine();
    this.renderLines();this.updateMetrics();
  }
  backspace(){
    const idx=this.curIdx();const arr=this.results[idx];
    if(!arr||arr.length===0)return;
    const was=arr.pop();this.total--;
    if(was)this.correct--;else{this.incorrect--;this.mistakes=Math.max(0,this.mistakes-1);}
    flashKey('backspace',true);this.renderLines();this.updateMetrics();
  }
  completeLine(){
    const idx=this.curIdx();const line=this.lines[idx];const arr=this.results[idx];
    let anyErr=false,hasChar=false;
    for(let i=0;i<=line.length;i++){const c=line[i];
      if(c===' '||i===line.length){if(hasChar){this.words++;if(anyErr)this.wrongWords++;}anyErr=false;hasChar=false;}
      else{hasChar=true;if(!arr[i])anyErr=true;}}
    this.lineInPage++;
    if(this.lineInPage>=4){this.pageStart+=4;this.lineInPage=0;}
    if(this.pageStart+3>=this.lines.length){
      const more=wrapText(buildParagraph().text,WRAP);
      this.lines=this.lines.concat(more);
    }
  }
  renderLines(){
    const cur=this.curIdx();
    for(let i=0;i<4;i++){
      const el=document.getElementById('l'+i);const idx=this.pageStart+i;const line=this.lines[idx]||'';
      el.classList.toggle('cur',idx===cur);
      const arr=this.results[idx]||[];
      let html='';
      for(let j=0;j<line.length;j++){
        let cls='c';
        if(j<arr.length)cls+=arr[j]?' ok':' err'+(line[j]===' '?' space':'');
        else if(idx===cur && j===arr.length)cls+=' cursor';
        html+='<span class="'+cls+'">'+(line[j]===' '?'&nbsp;':escapeHtml(line[j]))+'</span>';
      }
      el.innerHTML=html;
    }
  }
  tick(){
    if(!this.started||this.paused||this.finished)return;
    const now=performance.now();const dt=(now-this.lastTick)/1000;this.lastTick=now;this.elapsed+=dt;
    if(this.mode==='live'){this.updateTimer();}
    else{this.remaining=Math.max(0,MODES[this.mode].secs-this.elapsed);this.updateTimer();if(this.remaining<=0){this.finish();return;}}
    if(this.elapsed-this.lastSample>=3){this.lastSample=this.elapsed;this.samples.push({t:Math.round(this.elapsed),wpm:this.wpm(),acc:this.accuracy(),wrong:this.wrongWords});}
    this.updateMetrics();
  }
  wpm(){const min=this.elapsed/60;return min>0?Math.round((this.correct/5)/min):0;}
  accuracy(){return this.total>0?Math.round((this.correct/this.total)*100):100;}
  updateTimer(){const t=document.getElementById('timer');t.textContent=this.mode==='live'?fmtHMS(this.elapsed):fmtMS(Math.ceil(this.remaining));}
  updateMetrics(){set('m_wpm',this.wpm());set('m_acc',this.accuracy()+'%');set('m_chars',this.total);set('m_words',this.words);set('m_wrong',this.wrongWords);set('m_mistakes',this.mistakes);set('m_streak',this.streak);set('m_best',this.bestStreak);}
  togglePause(){this.paused=!this.paused;document.getElementById('pauseBtn').textContent=this.paused?'▶ Resume':'⏸ Pause';if(!this.paused)this.lastTick=performance.now();}
  finish(){
    if(this.finished)return;this.finished=true;clearInterval(this.tickHandle);document.removeEventListener('keydown',this._key);
    const result={date:new Date().toISOString(),mode:MODES[this.mode].label,cat:this.cat,wpm:this.wpm(),acc:this.accuracy(),chars:this.total,words:this.words,wrongWords:this.wrongWords,duration:Math.round(this.elapsed),bestStreak:this.bestStreak,samples:this.samples};
    store.history.push(result);saveData(store);checkAchievements();showResults(result);
  }
  teardown(){this.finished=true;clearInterval(this.tickHandle);document.removeEventListener('keydown',this._key);const p=document.getElementById('prompter');if(this._prevent)p.removeEventListener('mousedown',this._prevent);}
}
function set(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtMS(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function fmtHMS(sec){sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');}

/* ============ RESULTS ============ */
let perfChartRef=null;
function gradeFor(wpm,acc){const score=wpm*0.7+acc*0.6;if(acc>=99&&wpm>=70)return 'S';if(score>=110)return 'A+';if(score>=90)return 'A';if(score>=72)return 'B';if(score>=55)return 'C';return 'D';}
function showResults(r){
  document.getElementById('rGrade').textContent=gradeFor(r.wpm,r.acc);
  const stats=[['WPM',r.wpm],['Accuracy',r.acc+'%'],['Wrong Words',r.wrongWords],['Characters',r.chars],['Words',r.words],['Duration',fmtMS(r.duration)],['Best Streak',r.bestStreak]];
  const g=document.getElementById('rStats');g.innerHTML='';
  stats.forEach(([k,v])=>{const d=document.createElement('div');d.className='rstat';d.innerHTML='<div class="k">'+k+'</div><div class="v tnum">'+v+'</div>';g.appendChild(d);});
  drawPerfChart(r);go('results');
}
function drawPerfChart(r){
  if(perfChartRef)perfChartRef.destroy();
  const s=r.samples.length?r.samples:[{t:0,wpm:r.wpm,acc:r.acc,wrong:r.wrongWords},{t:r.duration||1,wpm:r.wpm,acc:r.acc,wrong:r.wrongWords}];
  perfChartRef=new Chart(document.getElementById('perfChart'),{type:'line',
    data:{labels:s.map(x=>x.t+'s'),datasets:[
      {label:'WPM',data:s.map(x=>x.wpm),borderColor:'oklch(0.62 0.17 140)',backgroundColor:'oklch(0.62 0.17 140 / .15)',tension:.35,fill:true,yAxisID:'y'},
      {label:'Accuracy %',data:s.map(x=>x.acc),borderColor:'oklch(0.6 0.12 250)',tension:.35,yAxisID:'y1'},
      {label:'Wrong Words',data:s.map(x=>x.wrong),borderColor:'oklch(0.6 0.19 22)',borderDash:[5,4],tension:.35,yAxisID:'y'}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700'},usePointStyle:true}}},
      scales:{y:{beginAtZero:true,title:{display:true,text:'WPM / Wrong'}},y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false},title:{display:true,text:'Accuracy %'}}}}});
}

/* ============ DASHBOARD ============ */
function aggregate(){
  const h=store.history;const total=h.length;
  const bestWpm=h.reduce((m,x)=>Math.max(m,x.wpm),0);const avgWpm=total?Math.round(h.reduce((s,x)=>s+x.wpm,0)/total):0;
  const bestAcc=h.reduce((m,x)=>Math.max(m,x.acc),0);const avgAcc=total?Math.round(h.reduce((s,x)=>s+x.acc,0)/total):0;
  const totalWords=h.reduce((s,x)=>s+x.words,0);const totalChars=h.reduce((s,x)=>s+x.chars,0);const totalTime=h.reduce((s,x)=>s+x.duration,0);
  const masterHit=h.some(x=>x.wpm>=80&&x.acc>=95);
  return {total,bestWpm,avgWpm,bestAcc,avgAcc,totalWords,totalChars,totalTime,masterHit};
}
let dashChartRef=null;
function renderDashboard(){
  const a=aggregate();
  document.getElementById('dashCount').textContent=a.total+' session'+(a.total===1?'':'s');
  const cells=[['Total Sessions',a.total],['Best WPM',a.bestWpm],['Average WPM',a.avgWpm],['Best Accuracy',a.bestAcc+'%'],['Average Accuracy',a.avgAcc+'%'],['Total Words',a.totalWords],['Total Characters',a.totalChars],['Practice Time',fmtHMS(a.totalTime)],['Achievements',store.unlocked.length+' / '+ACHIEVEMENTS.length]];
  const g=document.getElementById('dashGrid');g.innerHTML='';
  cells.forEach(([k,v])=>{const d=document.createElement('div');d.className='dstat';d.innerHTML='<div class="k">'+k+'</div><div class="v tnum">'+v+'</div>';g.appendChild(d);});
  const holder=document.getElementById('historyHolder');
  if(!store.history.length){holder.innerHTML='';const e=document.createElement('div');e.className='empty';e.appendChild(chImg('reading',{w:140,anim:'anim-float'}));const p=document.createElement('div');p.textContent='No sessions yet. Pick a mode on the home screen and start typing!';e.appendChild(p);holder.appendChild(e);document.getElementById('dashChartBox').style.display='none';return;}
  document.getElementById('dashChartBox').style.display='block';
  const rows=store.history.slice().reverse().slice(0,15).map(x=>{const d=new Date(x.date);return '<tr><td>'+d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</td><td>'+x.mode+'</td><td>'+x.cat+'</td><td class="tnum">'+x.wpm+'</td><td class="tnum">'+x.acc+'%</td><td class="tnum">'+x.wrongWords+'</td></tr>';}).join('');
  holder.innerHTML='<table class="table"><thead><tr><th>When</th><th>Mode</th><th>Story</th><th>WPM</th><th>Acc</th><th>Wrong</th></tr></thead><tbody>'+rows+'</tbody></table>';
  if(dashChartRef)dashChartRef.destroy();
  const h=store.history.slice(-20);
  dashChartRef=new Chart(document.getElementById('dashChart'),{type:'line',
    data:{labels:h.map((_,i)=>'#'+(store.history.length-h.length+i+1)),datasets:[
      {label:'WPM',data:h.map(x=>x.wpm),borderColor:'oklch(0.62 0.17 140)',backgroundColor:'oklch(0.62 0.17 140 / .15)',tension:.35,fill:true,yAxisID:'y'},
      {label:'Accuracy %',data:h.map(x=>x.acc),borderColor:'oklch(0.6 0.12 250)',tension:.35,yAxisID:'y1'},
      {label:'Wrong Words',data:h.map(x=>x.wrongWords),borderColor:'oklch(0.6 0.19 22)',borderDash:[5,4],tension:.35,yAxisID:'y'}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{font:{family:'Nunito',weight:'700'},usePointStyle:true}}},
      scales:{y:{beginAtZero:true},y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false}}}}});
}

/* ============ ACHIEVEMENTS ============ */
function checkAchievements(){const a=aggregate();ACHIEVEMENTS.forEach(ac=>{if(!store.unlocked.includes(ac.id)&&ac.test(a)){store.unlocked.push(ac.id);saveData(store);toast(ac.ico,ac.name+' unlocked!');}});}
function renderAchievements(){
  document.getElementById('achCount').textContent=store.unlocked.length+' / '+ACHIEVEMENTS.length;
  const g=document.getElementById('achGrid');g.innerHTML='';
  ACHIEVEMENTS.forEach(ac=>{const on=store.unlocked.includes(ac.id);const d=document.createElement('div');d.className='ach '+(on?'unlocked':'locked');d.innerHTML='<div class="badge">'+(on?ac.ico:'🔒')+'</div><div><h4>'+ac.name+'</h4><p>'+ac.desc+'</p></div>';g.appendChild(d);});
}
function toast(ico,msg){const wrap=document.getElementById('toasts');const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="t-ico">'+ico+'</span><span>'+msg+'</span>';wrap.appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s,transform .4s';t.style.opacity='0';t.style.transform='translateX(120%)';setTimeout(()=>t.remove(),400);},3200);}

/* ============ DOWNLOAD ============ */
document.getElementById('downloadBtn').addEventListener('click',()=>{
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='typing-studio.html';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('⬇️','Downloading Typing Studio…');
});
</script>
